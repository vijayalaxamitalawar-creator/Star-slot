        function sha256(ascii) {
            const rr = (v, a) => (v >>> a) | (v << (32 - a));
            const maxWord = Math.pow(2, 32), words = [], len = ascii.length * 8;
            let i, j, res = '';
            if (!sha256.h) {
                sha256.h = []; sha256.k = [];
                let pc = 0, comp = {};
                for (let c = 2; pc < 64; c++) if (!comp[c]) {
                    for (i = 0; i < 313; i += c) comp[i] = c;
                    sha256.h[pc] = (Math.pow(c, 0.5) * maxWord) | 0;
                    sha256.k[pc++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
                }
            }
            let hash = sha256.h.slice(0, 8), k = sha256.k;
            ascii += '\x80';
            while (ascii.length % 64 - 56) ascii += '\x00';
            for (i = 0; i < ascii.length; i++) words[i >> 2] |= ascii.charCodeAt(i) << ((3 - i) % 4) * 8;
            words[words.length] = (len / maxWord) | 0; words[words.length] = len;
            for (j = 0; j < words.length;) {
                const w = words.slice(j, j += 16), old = hash;
                hash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {
                    const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
                    const t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + k[i] +
                        (w[i] = i < 16 ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10))) | 0);
                    const t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
                    hash = [(t1 + t2) | 0].concat(hash);
                    hash[4] = (hash[4] + t1) | 0;
                }
                for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
            }
            for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
                const b = (hash[i] >> (j * 8)) & 255;
                res += (b < 16 ? '0' : '') + b.toString(16);
            }
            return res;
        }

        function parseMarketDate(timeStr, ampm, refNow) {
            let [h, m] = (timeStr || "10:00").split(':').map(n => parseInt(n, 10));
            if (isNaN(h)) h = 10; if (isNaN(m)) m = 0;
            let ap = (ampm || "").toUpperCase();
            if (ap === "PM" && h < 12) h += 12;
            if (ap === "AM" && h === 12) h = 0;
            return new Date(refNow.getFullYear(), refNow.getMonth(), refNow.getDate(), h, m, 0, 0);
        }

        function getMarketSessionStatus(market, refNow = new Date()) {
            let ot = parseMarketDate(market.openTime || "10:00", market.openAmPm || "AM", refNow);
            let ct = parseMarketDate(market.closeTime || "12:00", market.closeAmPm || "PM", refNow);
            if (ct.getTime() <= ot.getTime()) {
                let yOpen = new Date(ot.getTime()); yOpen.setDate(yOpen.getDate() - 1);
                if (refNow.getTime() < ct.getTime()) ot = yOpen;
                else ct.setDate(ct.getDate() + 1);
            }
            if (market.isHoliday) return { openTarget:ot, closeTarget:ct, isOpenSessionActive:false, isCloseSessionActive:false, isMarketActive:false, isHoliday:true };
            let active = refNow.getTime() < ct.getTime();
            return { openTarget:ot, closeTarget:ct, isOpenSessionActive:refNow.getTime() < ot.getTime(), isCloseSessionActive:active, isMarketActive:active, isHoliday:false };
        }

        function getMarketCycleDate(market, now = new Date()) {
            let ot = parseMarketDate(market.openTime || "10:00", market.openAmPm || "AM", now);
            let ct = parseMarketDate(market.closeTime || "12:00", market.closeAmPm || "PM", now);
            if (ct.getTime() <= ot.getTime() && now.getTime() < ct.getTime()) ot.setDate(ot.getDate() - 1);
            return getLocalDateString(ot);
        }

        function syncDailyMarketResults() {
            let now = new Date(), changed = false;
            state.markets.forEach(m => {
                let cd = getMarketCycleDate(m, now);
                if (!m.resultDate) { m.resultDate = cd; changed = true; }
                else if (m.resultDate !== cd) {
                    if (m.result !== "***-**-***") {
                        m.result = "***-**-***";
                        let el = document.getElementById(`resultText_${m.id}`);
                        if (el) el.innerText = "***-**-***";

                }
            });
            if (changed) saveState();
        }

            dep.referralTotalDeposited = (dep.referralTotalDeposited || 0) + depositAmount;
            if (!Array.isArray(ref.referralHistory)) ref.referralHistory = [];
            if (typeof ref.referralBalance !== "number") ref.referralBalance = 0;
            if (typeof ref.referralTotalEarned !== "number") ref.referralTotalEarned = 0;

            let credit = 0, label = "";
            if (!dep.referralFirstBonusPaid && dep.referralTotalDeposited >= 200) {
                dep.referralFirstBonusPaid = true; credit = 100; label = "Starting Bonus (₹200+ Deposit)";
            } else {
                credit = Math.round((depositAmount * 0.03) * 100) / 100; label = "3% Commission";
            }
            if (credit > 0) {
                ref.referralBalance = Math.round((ref.referralBalance + credit) * 100) / 100;
                ref.referralTotalEarned = Math.round((ref.referralTotalEarned + credit) * 100) / 100;
                ref.referralHistory.push({ id:Date.now() + Math.floor(Math.random()*1000), friendPhone:dep.phone, friendName:dep.name, depositAmount, commission:credit, type:label, time:new Date().toLocaleString() });
            }
        }

        function openGameByIndex(mId, idx) { let r = state.gameRates[idx]; if (r) navigate('playGame', { mId, gType:r.name }); }
        const getRequiredDigitLength = gt => gt === "Single Digit" ? 1 : (gt === "Jodi Digit" ? 2 : 3);
        const pannaDigitVal = ch => ch === '0' ? 10 : parseInt(ch, 10);
        function isValidPannaDigit(d, gt) {
            if (!/^\d{3}$/.test(d)) return false;
            const a = pannaDigitVal(d[0]), b = pannaDigitVal(d[1]), c = pannaDigitVal(d[2]);
            if (gt === "Single Panna") return a < b && b < c;
            if (gt === "Double Panna") return a <= b && b <= c && (a === b || b === c) && !(a === b && b === c);
            if (gt === "Triple Panna") return d[0] === d[1] && d[1] === d[2];
            return a <= b && b <= c;
        }
        function isValidAnyPanna(d) {
            if (!/^\d{3}$/.test(d)) return false;
            const a = pannaDigitVal(d[0]), b = pannaDigitVal(d[1]), c = pannaDigitVal(d[2]);
            return a <= b && b <= c;
        }
        function enforceDigitLimit(el, fixedMax = null) {
            let max = fixedMax !== null ? fixedMax : getRequiredDigitLength(state.selectedGameType || "");

            el.value = cl;
        }

        function addToCart() {

                } else if (!isValidAnyPanna(p1) || !isValidAnyPanna(p2)) return alert("❌ सही Open Panna और Close Panna डालें!");
                if (!isStrictPositiveInt(rawAmt) || parseInt(rawAmt,10) < 10) return alert("कम से कम ₹10 दर्ज करें!");
                state.bidCart.push({ id:Date.now()+Math.floor(Math.random()*999), marketId:state.selectedMarket.id, marketName:state.selectedMarket.name, gameType:state.selectedGameType, session:state.selectedGameType.toUpperCase(), digit:`${p1}-${p2}`, amount:parseInt(rawAmt,10), phone:state.currentUserPhone });

            if (session === "OPEN" && !st.isOpenSessionActive) return alert("❌ OPEN सेशन समय समाप्त!");
            if (session === "CLOSE" && !st.isCloseSessionActive) return alert("❌ CLOSE सेशन समय समाप्त!");
            if (state.selectedGameType === "Jodi Digit" && session === "CLOSE") return alert("❌ क्लोज में जोड़ी नहीं खेल सकते!");
            if (!/^\d+$/.test(digit) || digit.length !== reqLen) return alert(`❌ ठीक ${reqLen} अंक ही दर्ज करें!`);
            if (state.selectedGameType.includes("Panna") && !isValidPannaDigit(digit, state.selectedGameType)) return alert(`❌ ${state.selectedGameType} के सही नियम के अनुसार 3 अंक डालें!`);
            if (!isStrictPositiveInt(rawAmt) || parseInt(rawAmt,10) < 10) return alert("कम से कम ₹10 दर्ज करें!");
            state.bidCart.push({ id:Date.now()+Math.floor(Math.random()*999), marketId:state.selectedMarket.id, marketName:state.selectedMarket.name, gameType:state.selectedGameType, session, digit, amount:parseInt(rawAmt,10), phone:state.currentUserPhone });

        function submitBids() {
            if (enforceNotBlocked() || isSubmittingBids || !state.bidCart.length) return;
            isSubmittingBids = true;
            try {
                let total = state.bidCart.reduce((s, i) => s + i.amount, 0), now = new Date();
                for (const b of state.bidCart) {
                    const m = state.markets.find(mk => mk.id === b.marketId);

                }
                let user = state.users[state.currentUserPhone];
                if (!user || user.balance < total) return alert("पर्याप्त बैलेंस नहीं है!");

        function renderGuessingForum(root) {

        function postGuessing() {
            if (enforceNotBlocked()) return;

        function deleteGuessingPost(id) {
            let p = state.guessingPosts.find(x => x.id === id);

            state.guessingPosts = state.guessingPosts.filter(x => x.id !== id); saveState();
            let card = document.getElementById(`guessPostCard_${id}`); if (card) card.remove(); else renderGuessingForum(document.getElementById('appRoot'));

        function toggleLike(id) {
            if (enforceNotBlocked()) return;

            let idx = p.likedBy.indexOf(state.currentUserPhone), nowLiked = idx === -1;
            if (nowLiked) { p.likedBy.push(state.currentUserPhone); p.likes = (p.likes || 0) + 1; }
            else { p.likedBy.splice(idx, 1); p.likes = Math.max(0, (p.likes || 1) - 1); }
            saveState();
            let btn = document.getElementById(`likeBtn_${id}`); if (btn) { btn.classList.toggle('liked', nowLiked); btn.innerText = `❤️ Like (${p.likes})`; }
        }
        function addComment(id) {

        function changeAvatarGallery(ev) {
            let f = ev.target.files[0]; if (!f) return;
            let r = new FileReader();
            r.onload = e => {
                let img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height, m = 180;
                    if (w > h && w > m) { h = Math.round(h*m/w); w = m; } else if (h > m) { w = Math.round(w*m/h); h = m; }
                    let c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0,w,h);
                    state.users[state.currentUserPhone].avatar = c.toDataURL('image/jpeg', 0.7); saveState(); navigate('profile');
                }; img.src = e.target.result;
            }; r.readAsDataURL(f);
        }

                <div class="admin-section"><h4>💰 Player Deposit Requests (${depList.length})</h4>${dHtml}</div>
                <div class="admin-section"><h4>💳 Deposit QR & UPI Settings</h4><div class="input-group"><label>Upload QR</label><input type="file" accept="image/*" onchange="handleQrUpload(event)" style="background:rgba(9,13,22,0.9);color:#fff;padding:8px;border:1px solid #334155;border-radius:8px;width:100%;"></div><div style="text-align:center;margin:8px 0;"><img id="adminQrPreview" src="${safeImageURL(state.depositQR,DEFAULT_QR_SVG)}" style="width:100px;height:100px;object-fit:contain;background:#fff;border-radius:6px;"></div><div class="input-group"><label>UPI / PhonePe</label><input type="text" id="admUpiInput" value="${escapeHTML(state.depositUPI)}"></div><button class="btn" style="background:var(--green);color:#000;width:100%;" onclick="adminSaveDepositSettings()">💾 Save Deposit Info</button></div>
                <div class="admin-section"><h4>📊 Market Bid Load / Jantri Summary</h4><div class="input-group"><label>Market</label><select id="admLoadMarket">${mOpts}</select></div><div class="input-group"><label>Date</label><input type="date" id="admLoadDate" value="${today}"></div><button class="btn" style="background:var(--primary);color:#000;width:100%;" onclick="adminCheckBidLoad()">Check Total Bid Load</button><div id="admLoadResultBox" style="margin-top:10px;max-height:200px;overflow-y:auto;"></div></div>
                <div class="admin-section"><h4>🔍 Player Game History Check</h4><div class="input-group"><label>Mobile Number</label><input type="text" id="admGameSearchPhone" placeholder="Mobile Number"></div><div class="input-group"><label>Date (Optional)</label><input type="date" id="admGameSearchDate"></div><button class="btn" style="background:var(--blue);color:#fff;width:100%;" onclick="adminSearchGameHistory()">Search Game History</button><div id="admGameResultBox" style="margin-top:10px;max-height:200px;overflow-y:auto;"></div></div>
                <div class="admin-section"><h4>5️⃣ Player Withdrawal Requests (${wdrList.length})</h4>${wHtml}</div>
                <div class="admin-section"><h4>1️⃣ Balance Add / Deduct</h4><div class="input-group"><input type="text" id="admPhone" placeholder="Mobile Number"></div><div class="input-group"><select id="admAction"><option value="add">Add</option><option value="deduct">Deduct</option></select></div><div class="input-group"><input type="number" id="admAmount" min="1" placeholder="Amount"></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;"><input type="checkbox" id="admCountAsDeposit" checked style="width:auto;"><label for="admCountAsDeposit" style="margin:0;">Deposit मानें (Referral Bonus / 3% Commission दें)</label></div><button class="btn" style="background:var(--green);color:#000;width:100%;" onclick="adminModBal()">Update Balance</button></div>
                <div class="admin-section"><h4>2️⃣ Market, Timing & Holiday Management</h4><div class="input-group"><input type="text" id="admMarketName" placeholder="Market Name"></div><div style="display:grid;grid-template-columns:2fr 1fr;gap:5px;"><div class="input-group"><input type="text" id="admOpenTime" placeholder="Open (04:15)"></div><div class="input-group"><select id="admOpenAmPm"><option value="AM">AM</option><option value="PM" selected>PM</option></select></div></div><div style="display:grid;grid-template-columns:2fr 1fr;gap:5px;"><div class="input-group"><input type="text" id="admCloseTime" placeholder="Close (06:15)"></div><div class="input-group"><select id="admCloseAmPm"><option value="AM">AM</option><option value="PM" selected>PM</option></select></div></div><button class="btn" style="background:var(--blue);color:#fff;width:100%;margin-bottom:10px;" onclick="adminAddMarket()">➕ Add Market</button><div class="input-group"><label>Select Market</label><select id="admDelMarketId" onchange="loadMarketForEdit()">${mOpts}</select></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;"><button class="btn" style="background:var(--primary);color:#000;" onclick="adminEditMarket()">✏️ Update</button><button class="btn" style="background:#8e44ad;color:#fff;" onclick="toggleMarketHoliday()">🏖️ Holiday</button></div><button class="btn" style="background:var(--red);color:#fff;width:100%;" onclick="adminDelMarket()">❌ Delete Market</button></div>
                <div class="admin-section"><h4>📊 Manage Game Rates</h4>${rHtml}<button class="btn" style="background:var(--green);color:#000;width:100%;" onclick="adminSaveRates()">💾 Save Rates</button></div>
                <div class="admin-section"><h4>📢 Declare Result</h4><div class="input-group"><label>Market</label><select id="admResMarket" onchange="updateAdminPendingBidDateHint()">${mOpts}</select></div><div class="input-group"><label>Bids Date</label><input type="date" id="admResDate" value="${today}"></div><div id="admPendingDateHint" style="font-size:11px;margin-bottom:8px;"></div><div class="input-group"><label>Result String</label><input type="text" id="admResStr" placeholder="123-6*-*** या 123-68-459"></div><div style="display:grid;grid-template-columns:2fr 1fr;gap:6px;"><button class="btn" style="background:var(--primary);color:#000;" onclick="adminDeclare()">Publish Result</button><button class="btn" style="background:#2c3e50;color:#fff;" onclick="adminResetMarketResult()">🔄 Reset</button></div></div>
                <div class="admin-section"><h4>4️⃣ Change Admin Password</h4><div class="input-group"><label>Admin Mobile</label><input type="text" id="newAdminPhone" value="${escapeHTML(state.adminCreds.phone)}"></div><div class="input-group"><label>New Password</label><div class="pass-wrap"><input type="password" id="newAdminPass" placeholder="नया पासवर्ड (4+ अक्षर)"><button type="button" class="pass-eye" onclick="togglePassVisibility('newAdminPass',this)">👁️</button></div></div><button class="btn" style="background:var(--blue);color:#fff;width:100%;" onclick="adminChangeCreds()">Save New Password</button></div>
                <div class="admin-section"><h4>Settings (WhatsApp & Notice)</h4><div class="input-group"><label>WhatsApp</label><input type="text" id="admWa" value="${escapeHTML(state.adminWhatsApp)}"></div><div class="input-group"><label>Notice</label><textarea id="admNotice" rows="2">${escapeHTML(state.noticeText)}</textarea></div><button class="btn" style="background:var(--green);color:#000;width:100%;" onclick="adminSaveSettings()">Save Settings</button></div>`;
            renderPnLBox(today); adminRenderPlayerDirectory('all'); updateAdminPendingBidDateHint();
        }

        function adminResetUserPassword(ph, id) {
            let u = state.users[ph]; if (!u) return;
            let np = prompt(`${ph} के लिए नया पासवर्ड लिखें (4+ अक्षर):`); if (!np || np.trim().length < 4) return;
            u.password = hashPassword(np.trim()); state.forgotRequests = state.forgotRequests.filter(r => r.id !== id);
            saveState(); alert("नया पासवर्ड सेट हो गया!"); navigate('adminLogin');
        }
        function approveDeposit(id) {
            let req = state.depositRequests.find(d => d.id === id); if (!req || req.status !== "PENDING") return;
            req.status = "APPROVED";
            if (!state.users[req.phone]) state.users[req.phone] = { name:req.name||("Player "+req.phone.slice(-4)), balance:0, phone:req.phone, password:"", avatar:"", bankDetails:"", upiDetails:"", referredBy:null, referralBalance:0, referralTotalEarned:0, referralHistory:[], referralFirstBonusPaid:false, referralTotalDeposited:0, isBlocked:false, blockReason:"", joinedAt:new Date().toLocaleDateString() };
            state.users[req.phone].balance = Math.round((state.users[req.phone].balance + req.amount) * 100) / 100;
            state.transactions.push({ phone:req.phone, type:`Deposit Approved (UTR: ${req.utr})`, amount:req.amount, date:getLocalDateString(), time:new Date().toLocaleString() });
            processReferralDeposit(req.phone, req.amount); saveState(); alert("डिपॉजिट अप्रूव हो गया!"); navigate('adminLogin');
        }
        function rejectDeposit(id) { let req = state.depositRequests.find(d=>d.id===id); if (!req || req.status!=="PENDING") return; req.status="REJECTED"; saveState(); alert("डिपॉजिट रिजेक्ट हो गया!"); navigate('adminLogin'); }
        function handleQrUpload(ev) {
            let f = ev.target.files[0]; if (!f) return;
            let r = new FileReader();
            r.onload = e => {
                let img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height, m = 360;
                    if (w > h && w > m) { h = Math.round(h*m/w); w = m; } else if (h > m) { w = Math.round(w*m/h); h = m; }
                    let c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0,w,h);
                    state.depositQR = c.toDataURL('image/jpeg', 0.75);
                    let prev = document.getElementById('adminQrPreview'); if (prev) prev.src = state.depositQR; saveState();
                }; img.src = e.target.result;
            }; r.readAsDataURL(f);
        }
        function adminSaveDepositSettings() { let u = (document.getElementById('admUpiInput')?.value||'').trim(); if (u) state.depositUPI = u; saveState(); alert("QR व UPI सेव हो गया!"); }
        function adminCheckBidLoad() {
            let mId = parseInt(document.getElementById('admLoadMarket')?.value, 10), dt = document.getElementById('admLoadDate')?.value || getLocalDateString(), box = document.getElementById('admLoadResultBox'); if (!box) return;
            let f = state.bids.filter(b => b.marketId === mId && b.date === dt && b.status !== "REFUNDED");
            if (!f.length) { box.innerHTML = `<p style="color:#94a3b8;">कोई बिड नहीं लगी है।</p>`; return; }
            let tot = 0, grp = {};
            f.forEach(b => { tot += b.amount; let k = `${b.gameType} (${b.session}) - ${b.digit}`; if (!grp[k]) grp[k]={c:0,a:0}; grp[k].c++; grp[k].a+=b.amount; });
            box.innerHTML = `<div class="dark-row" style="border:1px solid var(--primary);">Bids: <b>${f.length}</b> | Total Load: <b style="color:var(--green)">₹${tot}</b></div>` + Object.entries(grp).sort((a,b)=>b[1].a-a[1].a).map(([k,v])=>`<div class="dark-row flex-between"><span>${escapeHTML(k)} (${v.c})</span><b style="color:var(--primary)">₹${v.a}</b></div>`).join('');
        }
        function adminSearchGameHistory() {
            let ph = (document.getElementById('admGameSearchPhone')?.value||'').trim(), dt = document.getElementById('admGameSearchDate')?.value, box = document.getElementById('admGameResultBox'); if (!box) return;
            if (!ph) return alert("मोबाइल नंबर दर्ज करें!");
            let f = state.bids.filter(b => b.phone === ph && (!dt || b.date === dt)).slice().reverse();
            box.innerHTML = !f.length ? `<p style="color:var(--red);">कोई रिकॉर्ड नहीं मिला।</p>` : f.map(b => `<div class="dark-row" style="border-left:3px solid ${b.status==='WON'?'var(--green)':(b.status==='LOST'?'var(--red)':'var(--primary)')};"><b>${escapeHTML(b.marketName)}</b> (${escapeHTML(b.session)})<br>${escapeHTML(b.gameType)} | ${escapeHTML(b.digit)} | ₹${b.amount} | <b>${escapeHTML(b.status)}</b> ${b.status==='WON'?'(Win: ₹'+b.winAmount+')':''}<br><small style="color:#94a3b8">${escapeHTML(b.date)} ${escapeHTML(b.time)}</small></div>`).join('');
        }
        function approveWithdraw(id) { let r = state.withdrawRequests.find(w=>w.id===id); if (r&&r.status==="PENDING") { r.status="APPROVED"; saveState(); alert("विड्रॉल अप्रूव हो गया!"); navigate('adminLogin'); } }
        function rejectWithdraw(id) {
            let r = state.withdrawRequests.find(w=>w.id===id); if (!r || r.status!=="PENDING") return;
            r.status = "REJECTED";
            if (state.users[r.phone]) { state.users[r.phone].balance = Math.round((state.users[r.phone].balance + r.amount)*100)/100; state.transactions.push({ phone:r.phone, type:"Withdrawal Rejected (Refund)", amount:r.amount, date:getLocalDateString(), time:new Date().toLocaleString() }); }
            saveState(); alert("विड्रॉल रिजेक्ट और रिफंड हो गया!"); navigate('adminLogin');
        }
        function adminModBal() {
            let ph = (document.getElementById('admPhone')?.value||'').replace(/\D/g,''), act = document.getElementById('admAction')?.value, raw = (document.getElementById('admAmount')?.value||'').trim(), chk = document.getElementById('admCountAsDeposit')?.checked;
            if (ph.length !== 10 || !isStrictPositiveInt(raw)) return alert("❌ सही 10 अंकों का नंबर व राशि दर्ज करें!");
            let amt = parseInt(raw, 10), today = getLocalDateString();
            if (!state.users[ph]) state.users[ph] = { name:"Player "+ph.slice(-4), balance:0, phone:ph, password:"", avatar:"", bankDetails:"", upiDetails:"", referredBy:null, referralBalance:0, referralTotalEarned:0, referralHistory:[], referralFirstBonusPaid:false, referralTotalDeposited:0, isBlocked:false, blockReason:"", joinedAt:new Date().toLocaleDateString() };
            if (act === 'add') {
                state.users[ph].balance = Math.round((state.users[ph].balance + amt) * 100) / 100;
                state.transactions.push({ phone:ph, type:"Admin Added", amount:amt, date:today, time:new Date().toLocaleString() });
                if (chk) processReferralDeposit(ph, amt);
            } else {
                if (state.users[ph].balance < amt) return alert(`❌ बैलेंस (₹${state.users[ph].balance}) कम है!`);
                state.users[ph].balance = Math.round((state.users[ph].balance - amt) * 100) / 100;
                state.transactions.push({ phone:ph, type:"Admin Deducted", amount:-amt, date:today, time:new Date().toLocaleString() });
            }
            saveState(); alert("बैलेंस अपडेट हो गया!"); navigate('adminLogin');
        }
        const isValidTimeFormat = s => /^(0?[1-9]|1[0-2]):[0-5]\d$/.test(s);
        function adminAddMarket() {
            let nm = (document.getElementById('admMarketName')?.value||'').trim().toUpperCase(), ot = (document.getElementById('admOpenTime')?.value||'').trim(), ct = (document.getElementById('admCloseTime')?.value||'').trim();
            if (!nm || !isValidTimeFormat(ot) || !isValidTimeFormat(ct)) return alert("❌ सही नाम व समय (जैसे 04:15) दर्ज करें!");
            let nid = state.markets.length ? Math.max(...state.markets.map(m=>m.id))+1 : 1;
            state.markets.push({ id:nid, name:nm, openTime:ot, openAmPm:document.getElementById('admOpenAmPm').value, closeTime:ct, closeAmPm:document.getElementById('admCloseAmPm').value, result:"***-**-***", resultDate:getLocalDateString(), isHoliday:false, chart:[] });
            saveState(); alert("मार्केट जुड़ गई!"); navigate('adminLogin');
        }
        function loadMarketForEdit() {
            let m = state.markets.find(x => x.id === parseInt(document.getElementById('admDelMarketId')?.value, 10)); if (!m) return;
            document.getElementById('admMarketName').value = m.name; document.getElementById('admOpenTime').value = m.openTime; document.getElementById('admOpenAmPm').value = m.openAmPm;
            document.getElementById('admCloseTime').value = m.closeTime; document.getElementById('admCloseAmPm').value = m.closeAmPm;
        }
        function adminEditMarket() {
            let m = state.markets.find(x => x.id === parseInt(document.getElementById('admDelMarketId')?.value, 10)); if (!m) return;
            let nm = (document.getElementById('admMarketName')?.value||'').trim().toUpperCase(), ot = (document.getElementById('admOpenTime')?.value||'').trim(), ct = (document.getElementById('admCloseTime')?.value||'').trim();
            if (!nm || !isValidTimeFormat(ot) || !isValidTimeFormat(ct)) return alert("❌ सही नाम व समय भरें!");
            m.name = nm; m.openTime = ot; m.openAmPm = document.getElementById('admOpenAmPm').value; m.closeTime = ct; m.closeAmPm = document.getElementById('admCloseAmPm').value;
            saveState(); alert("मार्केट अपडेट हो गई!"); navigate('adminLogin');
        }
        function toggleMarketHoliday() {
            let m = state.markets.find(x => x.id === parseInt(document.getElementById('admDelMarketId')?.value, 10)); if (!m) return;
            m.isHoliday = !m.isHoliday; saveState(); alert(`🏖️ "${m.name}" अब ${m.isHoliday?'HOLIDAY (बंद)':'ACTIVE (चालू)'} है!`); navigate('adminLogin');
        }
        function adminDelMarket() {
            let mId = parseInt(document.getElementById('admDelMarketId')?.value, 10), m = state.markets.find(x => x.id === mId); if (!m) return;
            if (!confirm(`"${m.name}" डिलीट करें? पेंडिंग बिड्स रिफंड हो जाएंगी।`)) return;
            let cnt = 0, today = getLocalDateString();
            state.bids.forEach(b => { if (b.marketId === mId && b.status === "PENDING") { b.status = "REFUNDED"; if (state.users[b.phone]) { state.users[b.phone].balance = Math.round((state.users[b.phone].balance+b.amount)*100)/100; state.transactions.push({ phone:b.phone, type:`Market Deleted Refund (${b.marketName})`, amount:b.amount, date:today, time:new Date().toLocaleString() }); } cnt++; } });
            state.markets = state.markets.filter(x => x.id !== mId); saveState(); alert(`डिलीट हो गई! (${cnt} बिड्स रिफंड)`); navigate('adminLogin');
        }
        function adminSaveRates() {
            const rp = /^\d+(?:\.\d+)?\s*ka\s*\d+(?:\.\d+)?$/i; let upd = [];
            for (let i = 0; i < state.gameRates.length; i++) {
                let v = (document.getElementById(`rateInput_${i}`)?.value||'').trim();
                if (!rp.test(v)) return alert(`❌ "${state.gameRates[i].name}" का रेट '10 ka 95' फॉर्मेट में लिखें!`);
                upd.push({ name:state.gameRates[i].name, rate:v });
            }
            state.gameRates = upd; saveState(); alert("सभी रेट्स अपडेट हो गए!");
        }
        function getRateMultiplier(gt) {
            const r = state.gameRates.find(x => x.name === gt);
            if (r && r.rate) { const m = r.rate.match(/(\d+(?:\.\d+)?)\s*ka\s*(\d+(?:\.\d+)?)/i); if (m && parseFloat(m[1]) > 0) return parseFloat(m[2]) / parseFloat(m[1]); }
            return ({ "Single Digit":9.5, "Jodi Digit":95, "Single Panna":140, "Double Panna":280, "Triple Panna":600, "Half Sangam":1000, "Full Sangam":10000 })[gt] || 0;
        }
        const pannaSumDigit = p => String((parseInt(p[0],10) + parseInt(p[1],10) + parseInt(p[2],10)) % 10);
        function adminResetMarketResult() {
            let m = state.markets.find(x => x.id === parseInt(document.getElementById('admResMarket')?.value, 10)); if (!m) return;
            m.result = "***-**-***"; m.resultDate = getMarketCycleDate(m, new Date()); saveState(); alert(`"${m.name}" का रिजल्ट रीसेट हो गया!`);
        }
        function adminDeclare() {
            let mId = parseInt(document.getElementById('admResMarket')?.value, 10), dt = document.getElementById('admResDate')?.value || getLocalDateString(), rEl = document.getElementById('admResStr');
            let res = (rEl?.value||'').trim(), m = state.markets.find(x => x.id === mId); if (!m) return;
            let pts = res.split('-'); if (pts.length !== 3 || pts[0].length !== 3 || pts[1].length !== 2 || pts[2].length !== 3) return alert("❌ सही फॉर्मेट डालें: 123-6*-*** या 123-68-459");
            let op = pts[0], jd = pts[1], cp = pts[2], hasO = /^\d{3}$/.test(op)&&/^\d$/.test(jd[0]), hasC = /^\d{3}$/.test(cp)&&/^\d$/.test(jd[1]), fullJ = /^\d{2}$/.test(jd);
            if (!hasO && !hasC) return alert("❌ कम से कम OPEN या CLOSE के सही अंक डालें!");
            if (hasO && pannaSumDigit(op) !== jd[0]) return alert(`❌ Open Panna (${op}) का जोड़ ${pannaSumDigit(op)} होना चाहिए!`);
            if (hasC && pannaSumDigit(cp) !== jd[1]) return alert(`❌ Close Panna (${cp}) का जोड़ ${pannaSumDigit(cp)} होना चाहिए!`);
            if (dt >= getMarketCycleDate(m, new Date())) { m.result = res; m.resultDate = dt; }
            if (fullJ && !(m.lastChartDate === dt && m.chart[m.chart.length-1] === res)) { m.chart.push(res); m.lastChartDate = dt; }

            let od = jd[0], cd = jd[1], settled = 0, won = 0, payout = 0, nd = getLocalDateString();
            state.bids.forEach(b => {
                if (b.marketId !== mId || b.status !== "PENDING" || b.date !== dt) return;
                let ok = false, win = false;
                if (b.gameType === "Single Digit") { if (b.session==="OPEN"&&hasO){ok=true;win=b.digit===od;} else if (b.session==="CLOSE"&&hasC){ok=true;win=b.digit===cd;} }
                else if (b.gameType === "Jodi Digit") { if (fullJ){ok=true;win=b.digit===jd;} }
                else if (b.gameType.includes("Panna")) { if (b.session==="OPEN"&&hasO){ok=true;win=b.digit===op;} else if (b.session==="CLOSE"&&hasC){ok=true;win=b.digit===cp;} }
                else if (b.gameType === "Half Sangam" && hasO && hasC && fullJ) { ok=true; let s=String(b.digit||"").split('-'); if(s.length===2) win=(s[0].length===1?s[0]===od&&s[1]===cp:s[0]===op&&s[1]===cd); }
                else if (b.gameType === "Full Sangam" && hasO && hasC && fullJ) { ok=true; win=b.digit===`${op}-${cp}`; }
                if (ok) {
                    settled++;
                    if (win) {
                        won++; b.status = "WON"; b.winAmount = Math.round(b.amount * getRateMultiplier(b.gameType)); payout += b.winAmount;
                        if (state.users[b.phone]) { state.users[b.phone].balance = Math.round((state.users[b.phone].balance + b.winAmount)*100)/100; state.transactions.push({ phone:b.phone, type:`Won (${b.marketName} - ${b.gameType})`, amount:b.winAmount, date:nd, time:new Date().toLocaleString() }); }
                    } else b.status = "LOST";
                }
            });
            rEl.value = ''; saveState(); alert(`रिजल्ट सेटल हो गया!\nतारीख: ${dt}\nकुल सेटल: ${settled}\nजीत: ${won} (भुगतान: ₹${payout})`); navigate('adminLogin');
        }
        function adminChangeCreds() {
            let p = (document.getElementById('newAdminPhone')?.value||'').trim(), pw = (document.getElementById('newAdminPass')?.value||'').trim();
            if (!p || pw.length < 4) return alert("❌ 4+ अक्षर का नया पासवर्ड डालें!");
            state.adminCreds = { phone:p, pass:hashPassword(pw) }; document.getElementById('newAdminPass').value = ''; saveState(); alert("पासवर्ड बदल गया!");
        }
        function adminSaveSettings() { state.adminWhatsApp = (document.getElementById('admWa')?.value||'').trim(); state.noticeText = (document.getElementById('admNotice')?.value||'').trim(); saveState(); alert("सेटिंग्स सेव हो गई!"); }

        syncDailyMarketResults();
        if (!state.currentUserPhone || !state.users[state.currentUserPhone] || state.users[state.currentUserPhone].isBlocked) {
            if (state.currentUserPhone && state.users[state.currentUserPhone]?.isBlocked) { localStorage.removeItem('mk_logged_in_phone'); state.currentUserPhone = null; }
            renderLoginScreen();
        } else {
            document.getElementById('mainHeader').style.display = 'flex';
            document.getElementById('noticeBoardDisplay').style.display = 'block';
            document.getElementById('bottomNav').style.display = 'flex';
            navigate('home');
        }
    </script>
</body>
</html>
