        let deferredInstallPrompt = null;

        function downloadPwaIcon(size) {
            const c = document.createElement('canvas'); c.width = size; c.height = size;
            const ctx = c.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, size, size);
            g.addColorStop(0, '#312e81'); g.addColorStop(0.55, '#4c1d95'); g.addColorStop(1, '#1e3a8a');
            ctx.fillStyle = g; ctx.fillRect(0, 0, size, size);
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = Math.max(4, Math.round(size * 0.04));
            const pad = Math.round(size * 0.10);
            ctx.strokeRect(pad, pad, size - pad * 2, size - pad * 2);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `${Math.round(size * 0.30)}px sans-serif`;

            let hasChartForDate = m.chart.some(c => typeof c === "object" && c.date === dt);
            if (!settledBids.length && !hasChartForDate && m.resultDate !== dt) return alert(`❌ ${m.name} (${dt}) के लिए कोई रोलबैक डेटा नहीं मिला!`);
            if (!confirm(`क्या आप ${m.name} (${dt}) का रिजल्ट और ${settledBids.length} सेटल की गई बिड्स को रोलबैक (वापस PENDING) करना चाहते हैं?\nजीती हुई रकम यूज़र्स के वॉलेट से वापस कटेगी।`)) return;
            let reversedWin = 0, today = getLocalDateString();
            settledBids.forEach(b => {
                if (b.status === "WON" && b.winAmount > 0 && state.users[b.phone]) {
                    adjustUserBalanceFB(b.phone, -b.winAmount);
                    addTransactionToFB({ phone:b.phone, type:`Result Rollback (${b.marketName} - ${dt})`, amount:-b.winAmount, date:today, time:new Date().toLocaleString() });
                    reversedWin += b.winAmount;
                }
                b.status = "PENDING"; b.winAmount = 0; mkRef(`bids/${b.id}`).update({ status:"PENDING", winAmount:0 });
            });
            m.chart = m.chart.filter(c => !(typeof c === "object" && c.date === dt));
            if (m.lastChartDate === dt) m.lastChartDate = null; if (m.resultDate === dt) m.result = "***-**-***";
            saveMarketToFB(m);
            alert(`✅ Rollback सफल!\n${settledBids.length} बिड्स वापस PENDING हो गईं (वापस कटी जीत: ₹${reversedWin})। अब आप सही रिजल्ट डाल सकते हैं।`);
            navigate('adminLogin');
        }
        function adminDeclare() {
            let mId = parseInt(document.getElementById('admResMarket')?.value, 10), dt = document.getElementById('admResDate')?.value || getLocalDateString(), rEl = document.getElementById('admResStr');
            let res = (rEl?.value||'').trim(), m = state.markets.find(x => x.id === mId); if (!m) return;
            let pts = res.split('-'); if (pts.length !== 3 || pts[0].length !== 3 || pts[1].length !== 2 || pts[2].length !== 3) return alert("❌ सही फॉर्मेट डालें: 123-6*-*** या 123-68-459");
            let op = pts[0], jd = pts[1], cp = pts[2], hasO = /^\d{3}$/.test(op)&&/^\d$/.test(jd[0]), hasC = /^\d{3}$/.test(cp)&&/^\d$/.test(jd[1]), fullJ = /^\d{2}$/.test(jd);
            if (!hasO && !hasC) return alert("❌ कम से कम OPEN या CLOSE के सही अंक डालें!");
            if (hasO && !isValidAnyPanna(op)) return alert(`❌ Open Panna (${op}) सही मटका पन्ना क्रम में नहीं है!`);
            if (hasC && !isValidAnyPanna(cp)) return alert(`❌ Close Panna (${cp}) सही मटका पन्ना क्रम में नहीं है!`);
            if (hasO && pannaSumDigit(op) !== jd[0]) return alert(`❌ Open Panna (${op}) का जोड़ ${pannaSumDigit(op)} होना चाहिए!`);
            if (hasC && pannaSumDigit(cp) !== jd[1]) return alert(`❌ Close Panna (${cp}) का जोड़ ${pannaSumDigit(cp)} होना चाहिए!`);
            if (hasO && m.resultDate === dt && /^\d{3}-\d/.test(m.result) && !m.result.startsWith(`${op}-${jd[0]}`)) return alert(`❌ ${dt} का Open रिजल्ट पहले ही (${m.result}) घोषित हो चुका है!\nOpen बदलने के लिए पहले 'Rollback' बटन दबाएं।`);
            if (dt >= getMarketCycleDate(m, new Date())) { m.result = res; m.resultDate = dt; }
            if (fullJ) { let existingChartIdx = m.chart.findIndex(c => typeof c === "object" && c.date === dt); if (existingChartIdx !== -1) m.chart[existingChartIdx].result = res; else m.chart.push({ date:dt, result:res }); m.lastChartDate = dt; }
            saveMarketToFB(m);
            let od = jd[0], cd = jd[1], settled = 0, won = 0, payout = 0, nd = getLocalDateString();
            state.bids.forEach(b => {
                if (b.marketId !== mId || b.status !== "PENDING" || b.date !== dt) return;
                let ok = false, win = false;
                if (b.gameType === "Single Digit") { if (b.session==="OPEN"&&hasO){ok=true;win=b.digit===od;} else if (b.session==="CLOSE"&&hasC){ok=true;win=b.digit===cd;} }
                else if (b.gameType === "Jodi Digit") { if (fullJ){ok=true;win=b.digit===jd;} }
                else if (b.gameType.includes("Panna")) { if (b.session==="OPEN"&&hasO){ok=true;win=b.digit===op;} else if (b.session==="CLOSE"&&hasC){ok=true;win=b.digit===cp;} }
                else if (b.gameType === "Half Sangam" && hasO && hasC && fullJ) { ok=true; let s=String(b.digit||"").split('-'); if(s.length===2) win=(s[0].length===1?s[0]===od&&s[1]===cp:s[0]===op&&s[1]===cd); }
                else if (b.gameType === "Full Sangam" && hasO && hasC && fullJ) { ok=true; win=b.digit===`${op}-${cp}`; }
                if (ok) {
                    settled++;
                    if (win) {
                        won++; b.status = "WON"; b.winAmount = Math.round(b.amount * getRateMultiplier(b.gameType)); payout += b.winAmount;
                        mkRef(`bids/${b.id}`).update({ status:"WON", winAmount:b.winAmount });
                        if (state.users[b.phone]) { adjustUserBalanceFB(b.phone, b.winAmount); addTransactionToFB({ phone:b.phone, type:`Won (${b.marketName} - ${b.gameType})`, amount:b.winAmount, date:nd, time:new Date().toLocaleString() }); }
                    } else { b.status = "LOST"; mkRef(`bids/${b.id}`).update({ status:"LOST", winAmount:0 }); }
                }
            });
            rEl.value = ''; alert(`रिजल्ट सेटल हो गया!\nतारीख: ${dt}\nकुल सेटल: ${settled}\nजीत: ${won} (भुगतान: ₹${payout})`); navigate('adminLogin');
        }
        function adminChangeCreds() {
            let p = (document.getElementById('newAdminPhone')?.value||'').trim(), pw = (document.getElementById('newAdminPass')?.value||'').trim();
            if (!p || pw.length < 4) return alert("❌ 4+ अक्षर का नया पासवर्ड डालें!");
            state.adminCreds = { phone:p, pass:hashPassword(pw) }; document.getElementById('newAdminPass').value = ''; saveSettingsToFB(); alert("पासवर्ड बदल गया!");
        }
        function adminSaveSettings() { state.adminWhatsApp = (document.getElementById('admWa')?.value||'').trim(); state.noticeText = (document.getElementById('admNotice')?.value||'').trim(); saveSettingsToFB(); updateChromeUI(); alert("सेटिंग्स सेव हो गई!"); }

        window.addEventListener('hashchange', () => {
            if (window.location.hash.toLowerCase() === '#admin') { history.replaceState(null, '', window.location.pathname + window.location.search); navigate('adminLogin'); }
        });

        function showBootError(err) {
            let code = err && err.code ? err.code : '', msg = err && err.message ? err.message : 'Connection failed';
            let hint = (code === 'auth/operation-not-allowed' || code === 'auth/admin-restricted-operation')
                ? "Firebase Console ➔ Build/Security ➔ Authentication ➔ Sign-in method me jakar <b>Anonymous</b> ko Enable karein!"
                : (String(msg).toLowerCase().includes('permission_denied') ? "Realtime Database ➔ Rules me <b>\"auth != null\"</b> rule Publish karein!" : escapeHTML(msg));
            document.getElementById('appRoot').innerHTML = `<div class="form-card" style="max-width:350px;margin:60px auto;text-align:center;border:2px solid var(--red);"><h3 style="color:#fda4af;margin-bottom:8px;">⚠️ Connection Error</h3><p style="font-size:12px;color:#e2e8f0;margin-bottom:12px;line-height:1.5;">${hint}</p><button class="btn btn-play" onclick="location.reload()">🔄 Retry</button></div>`;
        }

        function bootFirebase() {
            const unsubscribe = auth.onAuthStateChanged(user => {
                unsubscribe();
                const authPromise = user ? Promise.resolve(user) : auth.signInAnonymously();
                authPromise.then(() => mkRef().once('value')).then(snap => {
                    if (!snap.exists()) return seedInitialFirebaseData();
                }).then(() => {
                    mkRef().on('value', snap => {
                        applyFirebaseSnapshot(snap.val());
                        if (!isFirebaseReady) {
                            isFirebaseReady = true; syncDailyMarketResults();
                            if (initialSecretAdmin) { try { history.replaceState(null, '', window.location.pathname); } catch (e) {} navigate('adminLogin'); }
                            else if (!state.currentUserPhone || !state.users[state.currentUserPhone] || state.users[state.currentUserPhone].isBlocked) {
                                if (state.currentUserPhone && state.users[state.currentUserPhone]?.isBlocked) { localStorage.removeItem('mk_logged_in_phone'); state.currentUserPhone = null; }
                                if (state.isAdminLoggedIn) navigate('adminLogin'); else renderLoginScreen();
                            } else {
                                document.getElementById('mainHeader').style.display = 'flex';
                                document.getElementById('noticeBoardDisplay').style.display = 'block';
                                document.getElementById('bottomNav').style.display = 'flex';
                                navigate('home');
                            }
                        } else { refreshActiveViewOnSync(); }
                    }, showBootError);
                }).catch(showBootError);
            });
        }
        bootFirebase();
    </script>
</body>
