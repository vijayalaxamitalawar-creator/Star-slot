        function sha256(ascii) {
            function rightRotate(value, amount) {
                return (value >>> amount) | (value << (32 - amount));
            }
            const mathPow = Math.pow;
            const maxWord = mathPow(2, 32);
            let i, j;
            let result = '';
            const words = [];
            const asciiBitLength = ascii.length * 8;
            if (!sha256.h) {
                sha256.h = [];
                sha256.k = [];
                let primeCounter = 0;
                const isComposite = {};
                for (let candidate = 2; primeCounter < 64; candidate++) {
                    if (!isComposite[candidate]) {
                        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                        sha256.h[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
                        sha256.k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
                    }
                }
            }
            let hash = sha256.h.slice(0, 8);
            const k = sha256.k;
            ascii += '\x80';
            while (ascii.length % 64 - 56) ascii += '\x00';

            words[words.length] = asciiBitLength;
            for (j = 0; j < words.length;) {

                const oldHash = hash;
                hash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {

                    const a = hash[0], e = hash[4];
                    const temp1 = hash[7]
                        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                        + ((e & hash[5]) ^ ((~e) & hash[6]))
                        + k[i]

                    const b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? '0' : '') + b.toString(16);
                }
            }

        function getMarketCycleDate(market, now = new Date()) {
            let openTarget = parseMarketDate(market.openTime || "10:00", market.openAmPm || "AM", now);
            let closeTarget = parseMarketDate(market.closeTime || "12:00", market.closeAmPm || "PM", now);
            if (closeTarget.getTime() <= openTarget.getTime()) {
                let yesterdayOpen = new Date(openTarget.getTime());
                yesterdayOpen.setDate(yesterdayOpen.getDate() - 1);
                if (now.getTime() < closeTarget.getTime()) {
                    openTarget = yesterdayOpen;
                }
            }
            return getLocalDateString(openTarget);
        }

        function syncDailyMarketResults() {

            state.markets.forEach(m => {
                let cycleDate = getMarketCycleDate(m, now);
                if (!m.resultDate) {
                    m.resultDate = cycleDate;
                    changed = true;
                } else if (m.resultDate !== cycleDate) {
                    if (m.result !== "***-**-***") {
                        m.result = "***-**-***";
                        let resEl = document.getElementById(`resultText_${m.id}`);
                        if (resEl) resEl.innerText = "***-**-***";
                    }
                    m.resultDate = cycleDate;
                    changed = true;
                }
            });
            if (changed) saveState();
        }

            if (!referrer || referrer.phone === depositorPhone || referrer.isSystem) return;

            depositor.referralTotalDeposited = (depositor.referralTotalDeposited || 0) + depositAmount;
            if (!Array.isArray(referrer.referralHistory)) referrer.referralHistory = [];
            if (typeof referrer.referralBalance !== "number") referrer.referralBalance = 0;
            if (typeof referrer.referralTotalEarned !== "number") referrer.referralTotalEarned = 0;

            if (!depositor.referralFirstBonusPaid) {

                    depositor.referralFirstBonusPaid = true;

                    referrer.referralBalance = Math.round((referrer.referralBalance + bonus) * 100) / 100;
                    referrer.referralTotalEarned = Math.round((referrer.referralTotalEarned + bonus) * 100) / 100;
                    referrer.referralHistory.push({

                        depositAmount: depositAmount,

                } else {

                        referrer.referralHistory.push({

                            depositAmount: depositAmount,
                            commission: comm,

                        });

                }

        function navigate(screen, param1 = null) {
            if (!state.currentUserPhone || !state.users[state.currentUserPhone]) {
                renderLoginScreen();

            if (screen !== 'home' && homeTimerInterval) {
                clearInterval(homeTimerInterval);
                homeTimerInterval = null;

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            let navEl = document.getElementById(`nav-${screen}`);
            if (navEl) navEl.classList.add('active');

            const root = document.getElementById('appRoot');
            if (!root) return;
            syncDailyMarketResults();
            saveState();

            if (screen === 'home') renderHome(root);
            else if (screen === 'gameSelect') renderGameSelect(root, param1);
            else if (screen === 'playGame') renderPlayGame(root, param1.mId, param1.gType);
            else if (screen === 'chart') renderChart(root, param1);
            else if (screen === 'bids') renderBids(root);
            else if (screen === 'profile') renderProfile(root);
            else if (screen === 'guessing') renderGuessingForum(root);
            else if (screen === 'chatBox') renderChatBox(root, param1);
            else if (screen === 'deposit') renderDeposit(root);
            else if (screen === 'rates') renderRates(root);
            else if (screen === 'adminLogin') {
                if (state.isAdminLoggedIn) renderAdmin(root);
                else renderAdminLogin(root);
            }
        }

        function parseMarketDate(timeStr, ampm, referenceNow) {
            let parts = (timeStr || "10:00").split(':');
            let hours = parseInt(parts[0], 10);
            let mins = parseInt(parts[1], 10);
            if (isNaN(hours)) hours = 10;
            if (isNaN(mins)) mins = 0;

            let upperAmPm = (ampm || "").toUpperCase();
            if (upperAmPm === "PM" && hours < 12) hours += 12;
            if (upperAmPm === "AM" && hours === 12) hours = 0;

            return new Date(referenceNow.getFullYear(), referenceNow.getMonth(), referenceNow.getDate(), hours, mins, 0, 0);
        }

        function getMarketSessionStatus(market, referenceNow) {
            let now = referenceNow || new Date();
            let openTarget = parseMarketDate(market.openTime || "10:00", market.openAmPm || "AM", now);
            let closeTarget = parseMarketDate(market.closeTime || "12:00", market.closeAmPm || "PM", now);

            if (closeTarget.getTime() <= openTarget.getTime()) {
                let yesterdayOpen = new Date(openTarget.getTime());
                yesterdayOpen.setDate(yesterdayOpen.getDate() - 1);
                if (now.getTime() < closeTarget.getTime()) {
                    openTarget = yesterdayOpen;
                } else {
                    closeTarget.setDate(closeTarget.getDate() + 1);
                }
            }

            if (market.isHoliday) {
                return {
                    openTarget,
                    closeTarget,
                    isOpenSessionActive: false,
                    isCloseSessionActive: false,
                    isMarketActive: false,
                    isHoliday: true
                };
            }

            let isMarketActive = now.getTime() < closeTarget.getTime();
            let isOpenSessionActive = now.getTime() < openTarget.getTime();
            let isCloseSessionActive = isMarketActive;

            return {
                openTarget,
                closeTarget,
                isOpenSessionActive,
                isCloseSessionActive,
                isMarketActive,
                isHoliday: false
            };
        }

        function checkMarketTiming(market) {
            return getMarketSessionStatus(market, new Date()).isMarketActive;
        }

        function renderHome(root) {

            syncDailyMarketResults();

                    html += `

                            <div class="m-times"><span>Open: ${escapeHTML(m.openTime || '10:00')} ${escapeHTML(m.openAmPm || 'AM')} | Close: ${escapeHTML(m.closeTime || '12:00')} ${escapeHTML(m.closeAmPm || 'PM')}</span></div>
                            <div class="m-timers-grid">
                                <div class="m-timer-box" id="openTimer_${m.id}">⏳ Open: ...</div>
                                <div class="m-timer-box" id="closeTimer_${m.id}">⏳ Close: ...</div>
                            </div>
                            <div class="m-result-box"><div class="m-result-text" id="resultText_${m.id}">${escapeHTML(m.result || '***-**-***')}</div></div>

                                <button class="btn btn-chart" onclick="navigate('chart', ${m.id})">📅 CHART</button>
                                <button class="btn btn-play" id="playBtn_${m.id}" onclick="handlePlayClick(${m.id})">▶ PLAY</button>
                            </div>
                        </div>
                    `;
                });
            }
            root.innerHTML = html;

            updateMarketTimers();
            homeTimerInterval = setInterval(updateMarketTimers, 1000);
        }

        function formatCountdown(diff) {
            if (diff <= 0) return "00:00:00";
            let totalSecs = Math.floor(diff / 1000);
            let hrs = Math.floor(totalSecs / 3600);
            let mins = Math.floor((totalSecs % 3600) / 60);
            let secs = totalSecs % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateMarketTimers() {
            if (!state.markets) return;
            syncDailyMarketResults();
            let now = new Date();
            state.markets.forEach(m => {
                let openTimerEl = document.getElementById(`openTimer_${m.id}`);
                let closeTimerEl = document.getElementById(`closeTimer_${m.id}`);
                let badgeContainer = document.getElementById(`badgeContainer_${m.id}`);
                let playBtn = document.getElementById(`playBtn_${m.id}`);
                if (!openTimerEl || !closeTimerEl) return;

                let status = getMarketSessionStatus(m, now);

                if (status.isHoliday) {
                    openTimerEl.innerHTML = "🏖️ Market Holiday";
                    openTimerEl.style.color = "var(--primary)";
                    closeTimerEl.innerHTML = "🔴 Closed Today";
                    closeTimerEl.style.color = "var(--red)";
                    if (badgeContainer && !badgeContainer.innerHTML.includes('HOLIDAY')) {
                        badgeContainer.innerHTML = `<span class="m-status status-holiday">HOLIDAY</span>`;
                    }
                    if (playBtn) playBtn.style.opacity = "0.5";
                    return;
                }

                let openDiff = status.openTarget.getTime() - now.getTime();
                let closeDiff = status.closeTarget.getTime() - now.getTime();

                if (openDiff <= 0) {
                    openTimerEl.innerHTML = "🔴 Open Closed";
                    openTimerEl.style.color = "var(--red)";
                } else {
                    openTimerEl.innerHTML = `⏳ Open: ${formatCountdown(openDiff)}`;
                    openTimerEl.style.color = "var(--green)";
                }

                if (closeDiff <= 0) {
                    closeTimerEl.innerHTML = "🔴 Close Closed";
                    closeTimerEl.style.color = "var(--red)";
                    if (badgeContainer && !badgeContainer.innerHTML.includes('CLOSED')) {
                        badgeContainer.innerHTML = `<span class="m-status status-closed">CLOSED</span>`;
                    }
                    if (playBtn) playBtn.style.opacity = "0.6";
                } else {
                    closeTimerEl.innerHTML = `⏳ Close: ${formatCountdown(closeDiff)}`;
                    closeTimerEl.style.color = "var(--primary)";
                    if (badgeContainer && !badgeContainer.innerHTML.includes('RUNNING')) {
                        badgeContainer.innerHTML = `<span class="m-status status-open">RUNNING</span>`;
                    }
                    if (playBtn) playBtn.style.opacity = "1";
                }
            });
        }

        function handlePlayClick(marketId) {
            if (enforceNotBlocked()) return;
            let market = state.markets.find(m => m.id === marketId);
            if (!market) return;
            if (market.isHoliday) { alert("🏖️ आज इस मार्केट की छुट्टी (Holiday) है!"); return; }
            if (!checkMarketTiming(market)) { alert("❌ इस मार्केट का समय समाप्त हो चुका है!"); return; }
            navigate('gameSelect', marketId);
        }

        function isOpenRequiredGame(gameName) {

        }

        function openGameByIndex(marketId, rateIdx) {
            let rateObj = state.gameRates[rateIdx];
            if (!rateObj) return;
            navigate('playGame', { mId: marketId, gType: rateObj.name });
        }

        function getRequiredDigitLength(gameType) {
            if (gameType === "Single Digit") return 1;
            if (gameType === "Jodi Digit") return 2;
            if (gameType.includes("Panna")) return 3;
            return 3;
        }

        function pannaDigitVal(ch) {
            return ch === '0' ? 10 : parseInt(ch, 10);
        }

        function isValidPannaDigit(digit, gameType) {
            if (!/^\d{3}$/.test(digit)) return false;
            const a = pannaDigitVal(digit[0]);
            const b = pannaDigitVal(digit[1]);
            const c = pannaDigitVal(digit[2]);
            if (gameType === "Single Panna") {
                return a < b && b < c;
            }
            if (gameType === "Double Panna") {
                return a <= b && b <= c && (a === b || b === c) && !(a === b && b === c);
            }
            if (gameType === "Triple Panna") {
                return digit[0] === digit[1] && digit[1] === digit[2];
            }
            return a <= b && b <= c;
        }

        function isValidAnyPanna(digit) {
            if (!/^\d{3}$/.test(digit)) return false;
            const a = pannaDigitVal(digit[0]);
            const b = pannaDigitVal(digit[1]);
            const c = pannaDigitVal(digit[2]);
            return a <= b && b <= c;
        }

        function enforceDigitLimit(inputEl, fixedMax = null) {
            let maxLen = fixedMax !== null ? fixedMax : getRequiredDigitLength(state.selectedGameType || "");
            let cleaned = inputEl.value.replace(/\D/g, '');
            if (cleaned.length > maxLen) {
                cleaned = cleaned.slice(0, maxLen);
            }
            inputEl.value = cleaned;
        }

        function updateHalfSangamLabels() {
            let modeEl = document.getElementById('halfSangamMode');
            let l1 = document.getElementById('sangamLbl1');
            let l2 = document.getElementById('sangamLbl2');
            let p1 = document.getElementById('sangamPart1');
            let p2 = document.getElementById('sangamPart2');

            p1.value = '';
            p2.value = '';

                l1.innerText = 'Open Ank (1 Digit)';
                p1.maxLength = 1;
                p1.placeholder = '0 से 9 तक 1 अंक';
                p1.setAttribute('oninput', 'enforceDigitLimit(this, 1)');

                l2.innerText = 'Close Panna (3 Digits)';
                p2.maxLength = 3;
                p2.placeholder = 'जैसे: 128, 112, 000';
                p2.setAttribute('oninput', 'enforceDigitLimit(this, 3)');
            } else {
                l1.innerText = 'Open Panna (3 Digits)';
                p1.maxLength = 3;
                p1.placeholder = 'जैसे: 128, 112, 000';
                p1.setAttribute('oninput', 'enforceDigitLimit(this, 3)');

                l2.innerText = 'Close Ank (1 Digit)';
                p2.maxLength = 1;
                p2.placeholder = '0 से 9 तक 1 अंक';
                p2.setAttribute('oninput', 'enforceDigitLimit(this, 1)');
            }
        }

        function renderPlayGame(root, marketId, gameType) {
            let market = state.markets.find(m => m.id === marketId);
            if (!market) { navigate('home'); return; }
            state.selectedMarket = market;
            state.selectedGameType = gameType;
            state.bidCart = [];
            let status = getMarketSessionStatus(market, new Date());

            if (status.isHoliday || !status.isCloseSessionActive) {
                alert(status.isHoliday ? "🏖️ आज इस मार्केट की छुट्टी है!" : "❌ इस मार्केट का समय समाप्त हो चुका है!");
                navigate('home');
                return;
            }

            if (isOpenRequiredGame(gameType) && !status.isOpenSessionActive) {
                alert(`❌ ओपन का समय समाप्त होने के बाद ${gameType} नहीं खेल सकते!`);
                navigate('gameSelect', marketId);
                return;
            }

            if (gameType === "Half Sangam") {
                root.innerHTML = `
                    <div class="sub-header"><button class="back-btn" onclick="navigate('gameSelect', ${market.id})">← Back</button><div><h4 style="color:var(--primary)">${escapeHTML(market.name)}</h4><small>Half Sangam</small></div></div>
                    <div class="form-card">
                        <div class="input-group">
                            <label>Sangam Type</label>
                            <select id="halfSangamMode" onchange="updateHalfSangamLabels()">
                                <option value="OPEN_ANK_CLOSE_PANNA">Open Ank (1) + Close Panna (3)</option>
                                <option value="OPEN_PANNA_CLOSE_ANK">Open Panna (3) + Close Ank (1)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label id="sangamLbl1">Open Ank (1 Digit)</label>
                            <input type="tel" id="sangamPart1" maxlength="1" oninput="enforceDigitLimit(this, 1)" placeholder="0 से 9 तक 1 अंक">
                        </div>
                        <div class="input-group">
                            <label id="sangamLbl2">Close Panna (3 Digits)</label>
                            <input type="tel" id="sangamPart2" maxlength="3" oninput="enforceDigitLimit(this, 3)" placeholder="जैसे: 128, 112, 000">
                        </div>
                        <div class="input-group"><label>Points (Min ₹10)</label><input type="number" id="bidAmountInput" min="10" placeholder="राशि (केवल पूरे अंक)"></div>
                        <button class="btn btn-play" style="width:100%" onclick="addToCart()">+ ADD TO LIST</button>
                    </div>
                    <div id="cartContainer"></div>
                `;
                return;
            }

            if (gameType === "Full Sangam") {
                root.innerHTML = `
                    <div class="sub-header"><button class="back-btn" onclick="navigate('gameSelect', ${market.id})">← Back</button><div><h4 style="color:var(--primary)">${escapeHTML(market.name)}</h4><small>Full Sangam</small></div></div>
                    <div class="form-card">
                        <div class="input-group">
                            <label>Open Panna (3 Digits)</label>
                            <input type="tel" id="sangamPart1" maxlength="3" oninput="enforceDigitLimit(this, 3)" placeholder="जैसे: 128, 112, 000">
                        </div>
                        <div class="input-group">
                            <label>Close Panna (3 Digits)</label>
                            <input type="tel" id="sangamPart2" maxlength="3" oninput="enforceDigitLimit(this, 3)" placeholder="जैसे: 459, 228, 777">
                        </div>
                        <div class="input-group"><label>Points (Min ₹10)</label><input type="number" id="bidAmountInput" min="10" placeholder="राशि (केवल पूरे अंक)"></div>
                        <button class="btn btn-play" style="width:100%" onclick="addToCart()">+ ADD TO LIST</button>
                    </div>
                    <div id="cartContainer"></div>
                `;
                return;
            }

            let sessionOptions = '';
            if (status.isOpenSessionActive) {
                sessionOptions += `<option value="OPEN">OPEN</option>`;
            }
            if (gameType !== "Jodi Digit" && status.isCloseSessionActive) {
                sessionOptions += `<option value="CLOSE">CLOSE</option>`;
            }

            let reqLen = getRequiredDigitLength(gameType);
            let placeholderText = reqLen === 1
                ? "0 से 9 तक एक अंक लिखें"
                : (reqLen === 2 ? "00 से 99 तक दो अंक लिखें"
                : (gameType === "Single Panna" ? "जैसे: 128, 120 (बढ़ते क्रम में, 0 सबसे बड़ा)"
                : (gameType === "Double Panna" ? "जैसे: 112, 122, 100 (बढ़ते क्रम में, 0 सबसे बड़ा)"
                : "जैसे: 000, 111, 222 ... 999")));

            root.innerHTML = `
                <div class="sub-header"><button class="back-btn" onclick="navigate('gameSelect', ${market.id})">← Back</button><div><h4 style="color:var(--primary)">${escapeHTML(market.name)}</h4><small>${escapeHTML(gameType)}</small></div></div>
                <div class="form-card">
                    <div class="input-group">
                        <label>Session</label>
                        <select id="bidSession" onchange="handleSessionChange()">
                            ${sessionOptions}
                        </select>
                    </div>
                    <div class="input-group">
                        <label>${escapeHTML(gameType)} (${reqLen} Digit Only)</label>
                        <input type="tel" id="bidDigitInput" maxlength="${reqLen}" oninput="enforceDigitLimit(this)" placeholder="${placeholderText}">
                    </div>
                    <div class="input-group"><label>Points (Min ₹10)</label><input type="number" id="bidAmountInput" min="10" placeholder="राशि (केवल पूरे अंक)"></div>
                    <button class="btn btn-play" style="width:100%" onclick="addToCart()">+ ADD TO LIST</button>
                </div>
                <div id="cartContainer"></div>
            `;
        }

        function handleSessionChange() {
            let sesInput = document.getElementById('bidSession');
            if (!sesInput) return;
            if (state.selectedGameType === "Jodi Digit" && sesInput.value === "CLOSE") {
                alert("❌ नियम के अनुसार क्लोज सेशन में जोड़ी नहीं खेली जा सकती!");
                sesInput.value = "OPEN";
            }
        }

        function addToCart() {
            if (enforceNotBlocked()) return;
            let amtInput = document.getElementById('bidAmountInput');
            if (!amtInput) return;
            let rawAmt = amtInput.value.trim();

            let status = getMarketSessionStatus(state.selectedMarket, new Date());
            if (status.isHoliday || !status.isCloseSessionActive) {
                alert("❌ यह मार्केट अभी बंद है!");
                return;
            }

            if (state.selectedGameType === "Half Sangam" || state.selectedGameType === "Full Sangam") {
                if (!status.isOpenSessionActive) {
                    alert(`❌ इस मार्केट का OPEN सेशन समय समाप्त हो चुका है! ${state.selectedGameType} अब नहीं खेल सकते।`);
                    return;
                }
                let p1El = document.getElementById('sangamPart1');
                let p2El = document.getElementById('sangamPart2');
                if (!p1El || !p2El) return;
                let p1 = p1El.value.trim();
                let p2 = p2El.value.trim();

                if (state.selectedGameType === "Half Sangam") {
                    let modeEl = document.getElementById('halfSangamMode');
                    let mode = modeEl ? modeEl.value : 'OPEN_ANK_CLOSE_PANNA';
                    if (mode === 'OPEN_ANK_CLOSE_PANNA') {
                        if (!/^\d$/.test(p1) || !isValidAnyPanna(p2)) {
                            alert("❌ कृपया सही 1 अंक का Open Ank और सही 3 अंकों का Close Panna (बढ़ते क्रम में, जैसे 128, 112, 000) दर्ज करें!");
                            return;
                        }
                    } else {
                        if (!isValidAnyPanna(p1) || !/^\d$/.test(p2)) {
                            alert("❌ कृपया सही 3 अंकों का Open Panna (जैसे 128, 112, 000) और सही 1 अंक का Close Ank दर्ज करें!");
                            return;
                        }
                    }
                } else {
                    if (!isValidAnyPanna(p1) || !isValidAnyPanna(p2)) {
                        alert("❌ कृपया सही 3 अंकों का Open Panna और Close Panna (जैसे 128, 112, 000) दर्ज करें!");
                        return;
                    }
                }

                if (!isStrictPositiveInt(rawAmt) || parseInt(rawAmt, 10) < 10) {
                    alert("कृपया कम से कम ₹10 (केवल पूरे अंक) दर्ज करें!");
                    return;
                }

                state.bidCart.push({
                    id: Date.now() + Math.floor(Math.random() * 1000),
                    marketId: state.selectedMarket.id,
                    marketName: state.selectedMarket.name,
                    gameType: state.selectedGameType,
                    session: state.selectedGameType.toUpperCase(),
                    digit: `${p1}-${p2}`,
                    amount: parseInt(rawAmt, 10),
                    phone: state.currentUserPhone
                });
                p1El.value = '';
                p2El.value = '';
                amtInput.value = '';
                renderCartList();
                return;
            }

            let digInput = document.getElementById('bidDigitInput');
            let sesInput = document.getElementById('bidSession');
            if (!digInput || !sesInput) return;

            let digit = digInput.value.trim();
            let session = sesInput.value;
            let reqLen = getRequiredDigitLength(state.selectedGameType);

            if (session === "OPEN" && !status.isOpenSessionActive) {
                alert("❌ इस मार्केट का OPEN सेशन समय समाप्त हो चुका है!");
                return;
            }
            if (session === "CLOSE" && !status.isCloseSessionActive) {
                alert("❌ इस मार्केट का CLOSE सेशन समय समाप्त हो चुका है!");
                return;
            }
            if (state.selectedGameType === "Jodi Digit" && session === "CLOSE") {
                alert("❌ क्लोज सेशन में जोड़ी नहीं खेल सकते!");
                return;
            }
            if (!/^\d+$/.test(digit) || digit.length !== reqLen) {
                alert(`❌ ${state.selectedGameType} के लिए ठीक ${reqLen} अंक ही दर्ज करें!`);
                return;
            }
            if (state.selectedGameType.includes("Panna") && !isValidPannaDigit(digit, state.selectedGameType)) {
                let ex = state.selectedGameType === 'Single Panna' ? '128, 120' : (state.selectedGameType === 'Double Panna' ? '112, 100' : '000, 111, 777');
                alert(`❌ ${state.selectedGameType} नियम: सही पाना दर्ज करें (जैसे: ${ex})!`);
                return;
            }
            if (!isStrictPositiveInt(rawAmt) || parseInt(rawAmt, 10) < 10) {
                alert("कृपया कम से कम ₹10 (केवल पूरे अंक) दर्ज करें!");
                return;
            }

            let amount = parseInt(rawAmt, 10);
            state.bidCart.push({
                id: Date.now() + Math.floor(Math.random() * 1000),
                marketId: state.selectedMarket.id,
                marketName: state.selectedMarket.name,
                gameType: state.selectedGameType,
                session: session,
                digit,
                amount,
                phone: state.currentUserPhone
            });
            digInput.value = '';
            amtInput.value = '';
            renderCartList();
        }

        function renderCartList() {
            let container = document.getElementById('cartContainer');
            if (!container) return;
            if (state.bidCart.length === 0) { container.innerHTML = ''; return; }
            let total = state.bidCart.reduce((s, i) => s + i.amount, 0);
            let html = `<h4 style="margin-bottom:8px; color:#ccc;">Bids Added (${state.bidCart.length})</h4>`;
            state.bidCart.forEach(item => {
                html += `<div class="bid-cart-item"><div><b>${escapeHTML(item.digit)}</b> (${escapeHTML(item.session)}) - <b>₹${item.amount}</b></div><button class="del-btn" onclick="removeFromCart(${item.id})">X</button></div>`;
            });
            html += `<button class="btn" id="submitBidsBtn" style="background:var(--green); color:#000; width:100%; margin-top:8px;" onclick="submitBids()">✅ SUBMIT ALL (₹${total})</button>`;
            container.innerHTML = html;
        }

        function removeFromCart(id) {
            state.bidCart = state.bidCart.filter(x => x.id !== id);
            renderCartList();
        }

        function submitBids() {
            if (enforceNotBlocked()) return;
            if (isSubmittingBids || !state.bidCart || state.bidCart.length === 0) return;
            isSubmittingBids = true;

            try {
                let total = state.bidCart.reduce((s, i) => s + i.amount, 0);
                if (total <= 0) return;

                let now = new Date();
                for (const b of state.bidCart) {
                    const m = state.markets.find(mk => mk.id === b.marketId);
                    if (!m) { alert("❌ मार्केट उपलब्ध नहीं है!"); return; }
                    const st = getMarketSessionStatus(m, now);
                    if (st.isHoliday) { alert(`🏖️ ${m.name} आज छुट्टी (Holiday) पर है!`); return; }
                    let needOpen = (b.session === "OPEN" || isOpenRequiredGame(b.gameType));
                    if ((needOpen && !st.isOpenSessionActive) || (!needOpen && !st.isCloseSessionActive)) {
                        alert(`❌ ${m.name} (${b.session}) का समय समाप्त हो चुका है! कृपया इसे कार्ट से हटाएं।`);
                        return;
                    }
                }

                let user = state.users[state.currentUserPhone];
                if (!user || user.balance < total) { alert("पर्याप्त बैलेंस नहीं है!"); return; }

                user.balance = Math.round((user.balance - total) * 100) / 100;
                let today = getLocalDateString(now);
                let nowTime = now.toLocaleTimeString();

                state.bidCart.forEach(b => {
                    state.bids.push({ ...b, date: today, status: "PENDING", winAmount: 0, time: nowTime });
                });
                state.transactions.push({
                    phone: state.currentUserPhone,
                    type: `Bids Placed (${state.bidCart.length})`,
                    amount: -total,
                    date: today,
                    time: now.toLocaleString()
                });

                state.bidCart = [];
                saveState();
                alert("बिड सफलतापूर्वक लग गई!");
                navigate('bids');
            } finally {
                isSubmittingBids = false;
            }
        }

        function postGuessing() {
            if (enforceNotBlocked()) return;
            let mElem = document.getElementById('guessMarket');
            let tElem = document.getElementById('guessText');
            if (!mElem || !tElem) return;

            let market = mElem.value;
            let text = tElem.value.trim();
            if (!text) { alert("कृपया अपना गेसिंग नंबर लिखें!"); return; }

            let user = state.users[state.currentUserPhone];
            state.guessingPosts.push({
                id: Date.now(),
                phone: state.currentUserPhone,
                name: user.name,
                market: market,
                text: text,
                time: formatForumDateTime(),
                likes: 0,
                likedBy: [],
                comments: [],
                wishes: [],
                chats: {}
            });
            state.guessShowComposer = false;
            saveState();
            renderGuessingForum(document.getElementById('appRoot'));
        }

        function deleteGuessingPost(postId) {
            let post = state.guessingPosts.find(p => p.id === postId);
            if (!post) return;
            if (post.phone !== state.currentUserPhone && !state.isAdminLoggedIn) return;
            if (!confirm("क्या आप वाकई यह पोस्ट डिलीट करना चाहते हैं?")) return;
            state.guessingPosts = state.guessingPosts.filter(p => p.id !== postId);
            saveState();
            let card = document.getElementById(`guessPostCard_${postId}`);
            if (card) card.remove();
            else renderGuessingForum(document.getElementById('appRoot'));
        }

        function toggleLike(postId) {
            if (enforceNotBlocked()) return;
            let post = state.guessingPosts.find(p => p.id === postId);
            if (!post) return;
            if (!post.likedBy) post.likedBy = [];
            let index = post.likedBy.indexOf(state.currentUserPhone);
            let nowLiked = false;
            if (index > -1) {
                post.likedBy.splice(index, 1);
                post.likes = Math.max(0, (post.likes || 1) - 1);
            } else {
                post.likedBy.push(state.currentUserPhone);
                post.likes = (post.likes || 0) + 1;
                nowLiked = true;
            }
            saveState();
            let btn = document.getElementById(`likeBtn_${postId}`);
            if (btn) {
                btn.classList.toggle('liked', nowLiked);
                btn.innerText = `❤️ Like (${post.likes})`;
            }
        }

        function addComment(postId) {
            if (enforceNotBlocked()) return;
            let input = document.getElementById(`commentInput_${postId}`);
            if (!input) return;
            let text = input.value.trim();
            if (!text) return;
            let user = state.users[state.currentUserPhone];
            let post = state.guessingPosts.find(p => p.id === postId);
            if (!post) return;
            if (!post.comments) post.comments = [];
            post.comments.push({ name: user.name, text: text });
            saveState();

            let container = document.getElementById(`commentsContainer_${postId}`);
            if (container) {
                let div = document.createElement('div');
                div.style.cssText = "background:#11161d; padding:6px 9px; margin-top:4px; border-radius:6px; font-size:11px; color:#e2e8f0; border-left:2px solid var(--primary);";
                div.innerHTML = `<b>${escapeHTML(user.name)}:</b> ${escapeHTML(text)}`;
                container.appendChild(div);
                input.value = '';
            }
            let cnt = document.getElementById(`commentCount_${postId}`);
            if (cnt) cnt.innerText = post.comments.length;
        }

        function sendWish(postId) {
            if (enforceNotBlocked()) return;
            let post = state.guessingPosts.find(p => p.id === postId);
            if (!post) return;
            let user = state.users[state.currentUserPhone];
            if (!post.wishes) post.wishes = [];
            if (!post.wishes.includes(user.name)) {
                post.wishes.push(user.name);
                saveState();
                let wBox = document.getElementById(`wishesContainer_${postId}`);
                if (wBox) {
                    wBox.style.display = 'block';
                    wBox.innerHTML = `🎉 Wishes: ${post.wishes.map(escapeHTML).join(', ')}`;
                }
                alert("आपने बधाई भेज दी है!");
            } else {
                alert("आप पहले ही बधाई दे चुके हैं!");
            }
        }

        function openChatWithGuesser(postId) {
            state.activeChatPostId = postId;
            state.activeChatBuyerPhone = null;
            navigate('chatBox', postId);
        }

        function selectChatBuyer(postId, buyerPhone) {
            state.activeChatBuyerPhone = buyerPhone;
            renderChatBox(document.getElementById('appRoot'), postId);
        }

        function renderChatBox(root, postId) {
            let post = state.guessingPosts.find(p => p.id === postId);
            if (!post) { navigate('guessing'); return; }
            if (!post.chats || typeof post.chats !== "object") post.chats = {};

            let isPostAuthor = post.phone === state.currentUserPhone;

        function sendGift(postId, giftName, amount) {
            if (enforceNotBlocked()) return;
            let currentUser = state.users[state.currentUserPhone];
            let post = state.guessingPosts.find(p => p.id === postId);
            if (!post || post.phone === state.currentUserPhone) return;

            if (currentUser.balance < amount) {
                alert("आपके वॉलेट में पर्याप्त बैलेंस नहीं है! कृपया पहले डिपॉजिट करें।");
                return;
            }

            currentUser.balance = Math.round((currentUser.balance - amount) * 100) / 100;
            let guesserUser = state.users[post.phone];
            if (guesserUser) {
                guesserUser.balance = Math.round((guesserUser.balance + amount) * 100) / 100;
            }

            if (!post.chats || typeof post.chats !== "object") post.chats = {};
            if (!post.chats[state.currentUserPhone]) post.chats[state.currentUserPhone] = [];
            post.chats[state.currentUserPhone].push({
                sender: state.currentUserPhone,
                senderName: currentUser.name,
                text: `🎁 Sent a gift: ${giftName}`,
                isGift: true,
                time: new Date().toLocaleTimeString()
            });

            let today = getLocalDateString();
            state.transactions.push({ phone: state.currentUserPhone, type: "Gift Sent to " + post.name, amount: -amount, date: today, time: new Date().toLocaleString() });
            if (guesserUser) {
                state.transactions.push({ phone: post.phone, type: "Gift Received from " + currentUser.name, amount: amount, date: today, time: new Date().toLocaleString() });
            }

            saveState();
            alert(`सफलतापूर्वक ${giftName} भेज दिया गया! प्राइवेट चैट अब खुल गई है।`);
            renderChatBox(document.getElementById('appRoot'), postId);
        }

        function sendChatMessage(postId, buyerPhone) {
            if (enforceNotBlocked()) return;
            let input = document.getElementById('chatInputText');
            if (!input) return;
            let text = input.value.trim();
            if (!text) return;

            let post = state.guessingPosts.find(p => p.id === postId);
            if (!post) return;
            if (!post.chats || typeof post.chats !== "object") post.chats = {};
            let key = post.phone === state.currentUserPhone ? buyerPhone : state.currentUserPhone;
            if (!key) return;
            if (!post.chats[key]) post.chats[key] = [];

            let currentUser = state.users[state.currentUserPhone];
            post.chats[key].push({
                sender: state.currentUserPhone,
                senderName: currentUser.name,
                text: text,
                isGift: false,
                time: new Date().toLocaleTimeString()
            });

            saveState();
            renderChatBox(document.getElementById('appRoot'), postId);
        }

        function submitDepositRequest() {
            if (enforceNotBlocked()) return;
            let amtEl = document.getElementById('depAmtInput');
            let utrEl = document.getElementById('depUtrInput');
            if (!amtEl || !utrEl) return;

            let rawAmt = amtEl.value.trim();
            let utr = utrEl.value.trim().replace(/\s+/g, '').toUpperCase();
            if (!isStrictPositiveInt(rawAmt) || parseInt(rawAmt, 10) < 100) {
                alert("❌ कृपया कम से कम ₹100 (केवल पूरे अंक) दर्ज करें!");
                return;
            }
            if (!/^[A-Z0-9_-]{6,40}$/.test(utr)) {
                alert("❌ कृपया कम से कम 6 अक्षर/अंकों का सही UTR / Transaction Ref नंबर दर्ज करें!");
                return;
            }

            let isDuplicate = state.depositRequests.some(d =>
                String(d.utr || '').replace(/\s+/g, '').toUpperCase() === utr &&
                (d.status === "PENDING" || d.status === "APPROVED")
            );
            if (isDuplicate) {
                alert("❌ यह UTR / Transaction नंबर पहले ही सबमिट या अप्रूव हो चुका है! कृपया डुप्लिकेट UTR न डालें।");
                return;
            }

            let user = state.users[state.currentUserPhone];
            state.depositRequests.push({
                id: Date.now(),
                phone: user.phone,
                name: user.name,
                amount: parseInt(rawAmt, 10),
                utr: utr,
                status: "PENDING",
                date: getLocalDateString(),
                time: new Date().toLocaleString()
            });
            amtEl.value = '';
            utrEl.value = '';
            saveState();
            alert("डिपॉजिट रिक्वेस्ट एडमिन के पास भेज दी गई है! अप्रूव होते ही वॉलेट में बैलेंस जुड़ जाएगा।");
            navigate('profile');
        }

        function copyReferralLink() {
            let link = `${REFERRAL_BASE_URL}/?ref=${state.currentUserPhone}`;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(link).then(() => {
                    alert("✅ Referral Link कॉपी हो गया:\n" + link);
                }).catch(() => fallbackCopyText(link));
            } else {
                fallbackCopyText(link);
            }
        }

        function fallbackCopyText(text) {
            let ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                alert("✅ Copied!\n" + text);
            } catch (e) {
                prompt("नीचे से कॉपी करें:", text);
            }
            document.body.removeChild(ta);
        }

        function claimReferralToWallet() {
            if (enforceNotBlocked()) return;
            let user = state.users[state.currentUserPhone];
            if (!user) return;
            let refBal = Number(user.referralBalance || 0);
            if (refBal <= 0) {
                alert("❌ ट्रांसफर करने के लिए अभी आपके Referral Commission Box में कोई बैलेंस नहीं है!");
                return;
            }
            user.balance = Math.round((user.balance + refBal) * 100) / 100;
            user.referralBalance = 0;
            state.transactions.push({
                phone: user.phone,
                type: "Referral Commission Added to Wallet",
                amount: refBal,
                date: getLocalDateString(),
                time: new Date().toLocaleString()
            });
            saveState();
            alert(`✅ ₹${refBal} रेफरल कमीशन आपके मेन वॉलेट में जुड़ गया है!`);
            navigate('profile');
        }

        function changePlayerPassword() {
            if (enforceNotBlocked()) return;
            let oldEl = document.getElementById('chgOldPass');
            let newEl = document.getElementById('chgNewPass');
            let confEl = document.getElementById('chgConfPass');
            if (!oldEl || !newEl || !confEl) return;

            let oldPass = oldEl.value.trim();
            let newPass = newEl.value.trim();
            let confPass = confEl.value.trim();
            let user = state.users[state.currentUserPhone];

            if (!oldPass || !newPass || !confPass) {
                alert("❌ कृपया सभी पासवर्ड बॉक्स भरें!");
                return;
            }
            if (!verifyPassword(oldPass, user.password)) {
                alert("❌ आपका वर्तमान (Current) पासवर्ड गलत है!");
                return;
            }
            if (newPass.length < 4) {
                alert("❌ नया पासवर्ड कम से कम 4 अक्षर का होना चाहिए!");
                return;
            }
            if (newPass !== confPass) {
                alert("❌ दोनों नए पासवर्ड एक जैसे होने चाहिए!");
                return;
            }
            if (newPass === oldPass) {
                alert("❌ नया पासवर्ड पुराने पासवर्ड से अलग होना चाहिए!");
                return;
            }

            user.password = hashPassword(newPass);
            oldEl.value = '';
            newEl.value = '';
            confEl.value = '';
            saveState();
            alert("✅ आपका पासवर्ड सफलतापूर्वक बदल गया है!");
        }

        function changeAvatarGallery(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function (e) {
                let img = new Image();
                img.onload = function () {
                    const maxDim = 180;
                    let w = img.width, h = img.height;
                    if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }
                    let canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    state.users[state.currentUserPhone].avatar = canvas.toDataURL('image/jpeg', 0.7);
                    saveState();
                    navigate('profile');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function sendWithdrawalRequest() {
            if (enforceNotBlocked()) return;
            let amtElem = document.getElementById('withdrawAmt');
            if (!amtElem) return;
            let rawAmt = amtElem.value.trim();
            let user = state.users[state.currentUserPhone];

            if (!user.bankDetails && !user.upiDetails) {
                alert("❌ कृपया पहले अपनी Bank या UPI डिटेल्स सेव करें!");
                return;
            }
            if (!isStrictPositiveInt(rawAmt) || parseInt(rawAmt, 10) < 500) {
                alert("कम से कम ₹500 (केवल पूरे अंक) दर्ज करें!");
                return;
            }
            let amt = parseInt(rawAmt, 10);
            if (user.balance < amt) { alert("पर्याप्त बैलेंस नहीं है!"); return; }

            user.balance = Math.round((user.balance - amt) * 100) / 100;
            state.withdrawRequests.push({
                id: Date.now(),
                phone: user.phone,
                name: user.name,
                amount: amt,
                status: "PENDING",
                date: getLocalDateString(),
                time: new Date().toLocaleString()
            });
            state.transactions.push({
                phone: user.phone,
                type: "Withdrawal Requested",
                amount: -amt,
                date: getLocalDateString(),
                time: new Date().toLocaleString()
            });
            amtElem.value = '';
            saveState();
            alert("विड्रॉल रिक्वेस्ट एडमिन के पास भेज दी गई है!");
            navigate('profile');
        }

        function computeAdminPnL(dateFilter = null) {
            let validBids = state.bids.filter(b => b.status !== "REFUNDED" && (!dateFilter || b.date === dateFilter));
            let totalBidAmt = 0;
            let totalWinPayout = 0;
            let pendingBidAmt = 0;
            validBids.forEach(b => {
                totalBidAmt += Number(b.amount || 0);
                if (b.status === "WON") totalWinPayout += Number(b.winAmount || 0);
                if (b.status === "PENDING") pendingBidAmt += Number(b.amount || 0);
            });
            let netGamePnL = Math.round((totalBidAmt - totalWinPayout) * 100) / 100;

            let approvedDeposits = state.depositRequests.filter(d => d.status === "APPROVED" && (!dateFilter || d.date === dateFilter))
                .reduce((s, d) => s + Number(d.amount || 0), 0);
            let approvedWithdrawals = state.withdrawRequests.filter(w => w.status === "APPROVED" && (!dateFilter || w.date === dateFilter))
                .reduce((s, w) => s + Number(w.amount || 0), 0);

            let totalWalletLiability = 0;
            let totalRefEarnedAll = 0;
            Object.values(state.users).forEach(u => {
                if (!u.isSystem) {
                    totalWalletLiability += Number(u.balance || 0) + Number(u.referralBalance || 0);
                    totalRefEarnedAll += Number(u.referralTotalEarned || 0);
                }
            });

            return {
                bidsCount: validBids.length,
                totalBidAmt: Math.round(totalBidAmt * 100) / 100,
                totalWinPayout: Math.round(totalWinPayout * 100) / 100,
                pendingBidAmt: Math.round(pendingBidAmt * 100) / 100,
                netGamePnL,
                approvedDeposits: Math.round(approvedDeposits * 100) / 100,
                approvedWithdrawals: Math.round(approvedWithdrawals * 100) / 100,
                totalWalletLiability: Math.round(totalWalletLiability * 100) / 100,
                totalRefEarnedAll: Math.round(totalRefEarnedAll * 100) / 100
            };
        }

        function getPlayerPnLStats(phone) {
            let userBids = state.bids.filter(b => b.phone === phone);
            let validBids = userBids.filter(b => b.status !== "REFUNDED");
            let settledBids = userBids.filter(b => b.status === "WON" || b.status === "LOST");

            let totalBetAmt = validBids.reduce((s, b) => s + Number(b.amount || 0), 0);
            let settledBetAmt = settledBids.reduce((s, b) => s + Number(b.amount || 0), 0);
            let totalWonAmt = userBids.filter(b => b.status === "WON").reduce((s, b) => s + Number(b.winAmount || 0), 0);
            let pendingAmt = userBids.filter(b => b.status === "PENDING").reduce((s, b) => s + Number(b.amount || 0), 0);

            let playerNet = Math.round((totalWonAmt - settledBetAmt) * 100) / 100;
            let houseNet = Math.round((settledBetAmt - totalWonAmt) * 100) / 100;

            let approvedDeposits = state.depositRequests
                .filter(d => d.phone === phone && d.status === "APPROVED")
                .reduce((s, d) => s + Number(d.amount || 0), 0);
            let adminAdded = state.transactions
                .filter(t => t.phone === phone && t.type === "Admin Added")
                .reduce((s, t) => s + Number(t.amount || 0), 0);
            let approvedWithdraws = state.withdrawRequests
                .filter(w => w.phone === phone && w.status === "APPROVED")
                .reduce((s, w) => s + Number(w.amount || 0), 0);

            return {
                totalBidsCount: validBids.length,
                totalBetAmt: Math.round(totalBetAmt * 100) / 100,
                settledBetAmt: Math.round(settledBetAmt * 100) / 100,
                totalWonAmt: Math.round(totalWonAmt * 100) / 100,
                pendingAmt: Math.round(pendingAmt * 100) / 100,
                playerNet,
                houseNet,
                totalDepositIn: Math.round((approvedDeposits + adminAdded) * 100) / 100,
                approvedWithdraws: Math.round(approvedWithdraws * 100) / 100
            };
        }

        function adminViewPlayerFullHistory(phone) {

        function adminToggleBlockUser(phone, deletePostId = null) {
            if (!phone || phone === DEFAULT_VIP_PHONE) {
                alert("❌ सिस्टम VIP अकाउंट को ब्लॉक नहीं किया जा सकता!");
                return;
            }
            let user = state.users[phone];
            if (!user) {
                alert("❌ यह मोबाइल नंबर रजिस्टर नहीं है!");
                return;
            }

            if (!user.isBlocked) {
                let reason = prompt(`${user.name} (${phone}) की ID ब्लॉक करने का कारण लिखें:`, "Abuse language / Spam in Guessing Forum");
                if (reason === null) return;
                user.isBlocked = true;
                user.blockReason = reason.trim() || "Rule Violation";
                if (deletePostId) {
                    state.guessingPosts = state.guessingPosts.filter(p => p.id !== deletePostId);
                }
                saveState();
                alert(`🚫 यूज़र ${phone} की ID ब्लॉक कर दी गई है! अब वह लॉगिन या गेम नहीं खेल पाएगा।`);
            } else {
                if (!confirm(`क्या आप ${user.name} (${phone}) की ID को अनब्लॉक (Unblock) करना चाहते हैं?`)) return;
                user.isBlocked = false;
                user.blockReason = "";
                saveState();
                alert(`✅ यूज़र ${phone} की ID अनब्लॉक हो गई है!`);
            }

            if (document.getElementById('admProfResultBox')) {
                navigate('adminLogin');
            } else if (document.getElementById('guessPostCard_' + deletePostId) || document.querySelector('.gf-toolbar')) {
                renderGuessingForum(document.getElementById('appRoot'));
            }
        }

        function adminBlockByInput() {
            let el = document.getElementById('admBlockPhoneInput');
            if (!el) return;
            let phone = el.value.replace(/\D/g, '');
            if (phone.length !== 10) {
                alert("❌ कृपया 10 अंकों का सही मोबाइल नंबर दर्ज करें!");
                return;
            }
            adminToggleBlockUser(phone);
        }

        function adminDeleteGuessPost(postId) {
            if (!confirm("क्या आप वाकई इस गेसिंग पोस्ट को डिलीट करना चाहते हैं?")) return;
            state.guessingPosts = state.guessingPosts.filter(p => p.id !== postId);
            saveState();
            navigate('adminLogin');

        function handleQrUpload(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function (e) {
                let img = new Image();
                img.onload = function () {
                    const maxDim = 360;
                    let w = img.width, h = img.height;
                    if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }

                    let canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    state.depositQR = canvas.toDataURL('image/jpeg', 0.75);
                    let prev = document.getElementById('adminQrPreview');
                    if (prev) prev.src = state.depositQR;
                    saveState();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function adminCheckBidLoad() {
            let mEl = document.getElementById('admLoadMarket');
            let dEl = document.getElementById('admLoadDate');
            let box = document.getElementById('admLoadResultBox');
            if (!mEl || !dEl || !box) return;

            let mId = parseInt(mEl.value, 10);
            let date = dEl.value || getLocalDateString();
            let filtered = state.bids.filter(b => b.marketId === mId && b.date === date && b.status !== "REFUNDED");

            if (filtered.length === 0) {
                box.innerHTML = `<p style="color:#aaa;">इस मार्केट और तारीख पर कोई बिड नहीं लगी है।</p>`;
                return;
            }

            let totalAmt = 0;
            let groups = {};
            filtered.forEach(b => {
                totalAmt += b.amount;
                let key = `${b.gameType} (${b.session}) - Digit: ${b.digit}`;
                if (!groups[key]) groups[key] = { count: 0, amount: 0 };
                groups[key].count += 1;
                groups[key].amount += b.amount;
            });

            let rows = Object.entries(groups)
                .sort((a, b) => b[1].amount - a[1].amount)
                .map(([k, v]) => `<div style="background:#111; padding:6px; margin-bottom:4px; border-radius:4px; display:flex; justify-content:space-between;"><span>${escapeHTML(k)} (${v.count})</span><b style="color:var(--primary)">₹${v.amount}</b></div>`)
                .join('');

            box.innerHTML = `
                <div style="background:#111; padding:8px; border-radius:6px; margin-bottom:8px; border:1px solid var(--primary);">
                    Total Bids: <b>${filtered.length}</b> | Total Load: <b style="color:var(--green)">₹${totalAmt}</b>
                </div>
                ${rows}
            `;
        }

        function adminSaveRates() {

            saveState();
            alert("सभी गेम रेट्स सफलतापूर्वक अपडेट हो गए!");
        }

        function getRateMultiplier(gameType) {
            const rateObj = state.gameRates.find(r => r.name === gameType);
            if (rateObj && rateObj.rate) {
                const match = rateObj.rate.match(/(\d+(?:\.\d+)?)\s*ka\s*(\d+(?:\.\d+)?)/i);
                if (match) {
                    const base = parseFloat(match[1]);
                    const payout = parseFloat(match[2]);
                    if (base > 0) return payout / base;
                }
            }
            if (gameType === "Single Digit") return 9.5;
            if (gameType === "Jodi Digit") return 95;
            if (gameType === "Single Panna") return 140;
            if (gameType === "Double Panna") return 280;
            if (gameType === "Triple Panna") return 600;
            if (gameType === "Half Sangam") return 1000;
            if (gameType === "Full Sangam") return 10000;
            return 0;
        }

        function pannaSumDigit(pannaStr) {
            return String((parseInt(pannaStr[0], 10) + parseInt(pannaStr[1], 10) + parseInt(pannaStr[2], 10)) % 10);
        }

        function adminDeclare() {
            let mElem = document.getElementById('admResMarket');
            let dElem = document.getElementById('admResDate');
            let rElem = document.getElementById('admResStr');
            if (!mElem || !dElem || !rElem) return;

            let mId = parseInt(mElem.value, 10);
            let targetDate = dElem.value || getLocalDateString();
            let resStr = rElem.value.trim();
            let market = state.markets.find(m => m.id === mId);
            if (!market) return;

            let parts = resStr.split('-');
            if (parts.length !== 3 || parts[0].length !== 3 || parts[1].length !== 2 || parts[2].length !== 3) {
                alert("❌ रिज़ल्ट का सही फॉर्मेट डालें! जैसे: 123-6*-*** या 123-68-459");
                return;
            }

            let openPanna = parts[0];
            let jodi = parts[1];
            let closePanna = parts[2];

            let hasOpen = /^\d{3}$/.test(openPanna) && /^\d$/.test(jodi[0]);
            let hasClose = /^\d{3}$/.test(closePanna) && /^\d$/.test(jodi[1]);
            let hasFullJodi = /^\d{2}$/.test(jodi);

            if (!hasOpen && !hasClose) {
                alert("❌ कम से कम OPEN या CLOSE के सही अंक दर्ज करें!");
                return;
            }

            if (hasOpen && pannaSumDigit(openPanna) !== jodi[0]) {
                alert(`❌ Open Panna (${openPanna}) का जोड़ ${pannaSumDigit(openPanna)} होता है, इसलिए Jodi का पहला अंक ${pannaSumDigit(openPanna)} होना चाहिए!`);
                return;
            }

            if (hasClose && pannaSumDigit(closePanna) !== jodi[1]) {
                alert(`❌ Close Panna (${closePanna}) का जोड़ ${pannaSumDigit(closePanna)} होता है, इसलिए Jodi का दूसरा अंक ${pannaSumDigit(closePanna)} होना चाहिए!`);
                return;
            }

            let currentCycleDate = getMarketCycleDate(market, new Date());
            if (targetDate >= currentCycleDate) {
                market.result = resStr;
                market.resultDate = targetDate;
            }

            if (hasFullJodi) {
                if (!(market.lastChartDate === targetDate && market.chart[market.chart.length - 1] === resStr)) {
                    market.chart.push(resStr);
                    market.lastChartDate = targetDate;
                }
            }

            let openDigit = jodi[0];
            let closeDigit = jodi[1];
            let settledCount = 0;
            let wonCount = 0;
            let totalPayout = 0;
            let nowDateStr = getLocalDateString();

            state.bids.forEach(b => {
                if (b.marketId !== mId || b.status !== "PENDING" || b.date !== targetDate) return;

                let canSettle = false;
                let win = false;

                if (b.gameType === "Single Digit") {
                    if (b.session === "OPEN" && hasOpen) {
                        canSettle = true;
                        win = (b.digit === openDigit);
                    } else if (b.session === "CLOSE" && hasClose) {
                        canSettle = true;
                        win = (b.digit === closeDigit);
                    }
                } else if (b.gameType === "Jodi Digit") {
                    if (hasFullJodi) {
                        canSettle = true;
                        win = (b.digit === jodi);
                    }
                } else if (b.gameType === "Single Panna" || b.gameType === "Double Panna" || b.gameType === "Triple Panna") {
                    if (b.session === "OPEN" && hasOpen) {
                        canSettle = true;
                        win = (b.digit === openPanna);
                    } else if (b.session === "CLOSE" && hasClose) {
                        canSettle = true;
                        win = (b.digit === closePanna);
                    }
                } else if (b.gameType === "Half Sangam") {
                    if (hasOpen && hasClose && hasFullJodi) {
                        canSettle = true;
                        let segs = String(b.digit || "").split('-');
                        if (segs.length === 2) {
                            if (segs[0].length === 1 && segs[1].length === 3) {
                                win = (segs[0] === openDigit && segs[1] === closePanna);
                            } else if (segs[0].length === 3 && segs[1].length === 1) {
                                win = (segs[0] === openPanna && segs[1] === closeDigit);
                            }
                        }
                    }
                } else if (b.gameType === "Full Sangam") {
                    if (hasOpen && hasClose && hasFullJodi) {
                        canSettle = true;
                        win = (b.digit === `${openPanna}-${closePanna}`);
                    }
                }

                if (canSettle) {
                    settledCount++;
                    if (win) {
                        wonCount++;
                        let mult = getRateMultiplier(b.gameType);
                        b.status = "WON";
                        b.winAmount = Math.round(b.amount * mult);
                        totalPayout += b.winAmount;
                        if (state.users[b.phone]) {
                            state.users[b.phone].balance = Math.round((state.users[b.phone].balance + b.winAmount) * 100) / 100;
                            state.transactions.push({
                                phone: b.phone,
                                type: `Won (${b.marketName} - ${b.gameType})`,
                                amount: b.winAmount,
                                date: nowDateStr,
                                time: new Date().toLocaleString()
                            });
                        }
                    } else {
                        b.status = "LOST";
                    }
                }
            });

            rElem.value = '';
            saveState();
            alert(`रिजल्ट घोषित और सेटल हो गया!\nतारीख: ${targetDate}\nकुल बिड्स सेटल: ${settledCount}\nजीत: ${wonCount} (कुल भुगतान: ₹${totalPayout})`);
            navigate('adminLogin');
        }

        function adminChangeCreds() {
            let pElem = document.getElementById('newAdminPhone');
            let pwElem = document.getElementById('newAdminPass');
            if (!pElem || !pwElem) return;
            let p = pElem.value.trim();
            let pw = pwElem.value.trim();
            if (!p || pw.length < 4) { alert("❌ कम से कम 4 अक्षर का नया पासवर्ड डालें!"); return; }
            state.adminCreds = { phone: p, pass: hashPassword(pw) };
            pwElem.value = '';
            saveState();
            alert("एडमिन पासवर्ड सफलतापूर्वक बदल गया!");
        }

        function adminSaveSettings() {
            let waElem = document.getElementById('admWa');
            let notElem = document.getElementById('admNotice');
            if (!waElem || !notElem) return;
            state.adminWhatsApp = waElem.value.trim();
            state.noticeText = notElem.value.trim();
            saveState();
            alert("सेटिंग्स सेव हो गई!");
        }

        syncDailyMarketResults();

        if (!state.currentUserPhone || !state.users[state.currentUserPhone] || state.users[state.currentUserPhone].isBlocked) {
            if (state.currentUserPhone && state.users[state.currentUserPhone] && state.users[state.currentUserPhone].isBlocked) {
                localStorage.removeItem('mk_logged_in_phone');
                state.currentUserPhone = null;
            }
            renderLoginScreen();
        } else {
            let mh = document.getElementById('mainHeader');
            let nb = document.getElementById('noticeBoardDisplay');
            let bn = document.getElementById('bottomNav');
            if (mh) mh.style.display = 'flex';
            if (nb) nb.style.display = 'block';
            if (bn) bn.style.display = 'flex';
            navigate('home');
        }
    </script>
</body>
</html>
