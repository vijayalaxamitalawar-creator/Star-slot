            if (!user) {
                box.innerHTML = `<span style="color:var(--red);">यह यूजर रजिस्टर नहीं है!</span>`;
                return;
            }

            let referredCount = Object.values(state.users).filter(u => !u.isSystem && u.referredBy === phone).length;
            let userTxns = state.transactions.filter(t => t.phone === phone);
            let txnHtml = userTxns.length === 0 ? `<small style="color:#aaa">कोई ट्रांजैक्शन नहीं है।</small>` : '';
            userTxns.slice().reverse().forEach(t => {
                txnHtml += `<div style="font-size:11px; color:#ccc; border-bottom:1px solid #333; padding:2px 0;">${escapeHTML(t.type)}: <b>₹${t.amount}</b> (${escapeHTML(t.time)})</div>`;
            });

            box.innerHTML = `
                <div style="background:#111; padding:10px; border-radius:6px; margin-top:5px;">
                    <b>Name:</b> ${escapeHTML(user.name)}<br>
                    <b>Phone:</b> ${escapeHTML(user.phone)}<br>
                    <b>Current Balance:</b> <b style="color:var(--green)">₹${user.balance}</b><br>
                    <b>Referred By:</b> ${escapeHTML(user.referredBy || 'None')}<br>
                    <b>Total Referred:</b> ${referredCount} | <b>Ref Box:</b> ₹${Number(user.referralBalance || 0)} (Total Earned: ₹${Number(user.referralTotalEarned || 0)})<br>
                    <b>Bank Details:</b> ${escapeHTML(user.bankDetails || 'Not Provided')}<br>
                    <b>UPI Details:</b> ${escapeHTML(user.upiDetails || 'Not Provided')}<br>
                    <hr style="border-color:#333; margin:6px 0;">
                    <b>Wallet Transactions:</b><br>
                    ${txnHtml}
                </div>
            `;
        }

        function adminShowAllUsers() {
            let box = document.getElementById('admProfResultBox');
            if (!box) return;
            let players = Object.values(state.users).filter(u => !u.isSystem);
            if (players.length === 0) {
                box.innerHTML = `<p style="color:#aaa;">कोई प्लेयर रजिस्टर नहीं है।</p>`;
                return;
            }
            let html = `<div style="margin-bottom:6px; color:var(--primary);"><b>Total Players: ${players.length}</b></div>`;
            players.forEach(u => {
                html += `<div style="background:#111; padding:6px 8px; margin-bottom:4px; border-radius:4px; display:flex; justify-content:space-between;"><span><b>${escapeHTML(u.name)}</b> (${escapeHTML(u.phone)})</span><b style="color:var(--green)">₹${u.balance}</b></div>`;
            });
            box.innerHTML = html;
        }

        function approveWithdraw(id) {
            let req = state.withdrawRequests.find(w => w.id === id);
            if (req && req.status === "PENDING") {
                req.status = "APPROVED";
                saveState();
                alert("विड्रॉल अप्रूव हो गया!");
                navigate('adminLogin');
            }
        }

        function rejectWithdraw(id) {
            let req = state.withdrawRequests.find(w => w.id === id);
            if (req && req.status === "PENDING") {
                req.status = "REJECTED";
                if (state.users[req.phone]) {
                    state.users[req.phone].balance = Math.round((state.users[req.phone].balance + req.amount) * 100) / 100;
                    state.transactions.push({
                        phone: req.phone,
                        type: "Withdrawal Rejected (Refund)",
                        amount: req.amount,
                        time: new Date().toLocaleString()
                    });
                }
                saveState();
                alert("विड्रॉल रिजेक्ट किया गया और राशि यूज़र के वॉलेट में वापस जोड़ दी गई!");
                navigate('adminLogin');
            }
        }

        function adminModBal() {
            let pElem = document.getElementById('admPhone');
            let actElem = document.getElementById('admAction');
            let amtElem = document.getElementById('admAmount');
            let depChk = document.getElementById('admCountAsDeposit');
            if (!pElem || !actElem || !amtElem) return;

            let phone = pElem.value.replace(/\D/g, '');
            let action = actElem.value;
            let rawAmt = amtElem.value.trim();
            if (phone.length !== 10 || !isStrictPositiveInt(rawAmt)) {
                alert("❌ कृपया सही 10 अंकों का मोबाइल नंबर और 0 से अधिक पूरी राशि दर्ज करें!");
                return;
            }
            let amt = parseInt(rawAmt, 10);
            if (!state.users[phone]) {
                state.users[phone] = { name: "Player " + phone.slice(-4), balance: 0, phone, password: "", avatar: "", bankDetails: "", upiDetails: "", referredBy: null, referralBalance: 0, referralTotalEarned: 0, referralHistory: [], referralFirstBonusPaid: false, referralTotalDeposited: 0, joinedAt: new Date().toLocaleDateString() };
            }

            if (action === 'add') {
                state.users[phone].balance = Math.round((state.users[phone].balance + amt) * 100) / 100;
                state.transactions.push({ phone, type: "Admin Added", amount: amt, time: new Date().toLocaleString() });
                if (depChk && depChk.checked) {
                    processReferralDeposit(phone, amt);
                }
            } else {
                if (state.users[phone].balance < amt) {
                    alert(`❌ यूज़र का बैलेंस (₹${state.users[phone].balance}) कटौती राशि से कम है!`);
                    return;
                }
                state.users[phone].balance = Math.round((state.users[phone].balance - amt) * 100) / 100;
                state.transactions.push({ phone, type: "Admin Deducted", amount: -amt, time: new Date().toLocaleString() });
            }
            amtElem.value = '';
            saveState();
            alert("बैलेंस अपडेट हो गया!");
        }

        function isValidTimeFormat(str) {
            return /^(0?[1-9]|1[0-2]):[0-5]\d$/.test(str);
        }

        function adminAddMarket() {
            let mName = document.getElementById('admMarketName');
            let oTime = document.getElementById('admOpenTime');
            let oAmPm = document.getElementById('admOpenAmPm');
            let cTime = document.getElementById('admCloseTime');
            let cAmPm = document.getElementById('admCloseAmPm');
            if (!mName || !oTime || !oAmPm || !cTime || !cAmPm) return;

            let name = mName.value.trim().toUpperCase();
            let openTime = oTime.value.trim();
            let openAmPm = oAmPm.value;
            let closeTime = cTime.value.trim();
            let closeAmPm = cAmPm.value;

            if (!name || !isValidTimeFormat(openTime) || !isValidTimeFormat(closeTime)) {
                alert("❌ कृपया मार्केट का नाम और सही समय (जैसे 04:15) दर्ज करें!");
                return;
            }
            let newId = state.markets.length > 0 ? Math.max(...state.markets.map(m => m.id)) + 1 : 1;
            state.markets.push({ id: newId, name, openTime, openAmPm, closeTime, closeAmPm, result: "***-**-***", chart: [] });
            saveState();
            alert("मार्केट जुड़ गई!");
            navigate('adminLogin');
        }

        function loadMarketForEdit() {
            let sel = document.getElementById('admDelMarketId');
            if (!sel) return;
            let mId = parseInt(sel.value, 10);
            let m = state.markets.find(x => x.id === mId);
            if (!m) return;
            let mName = document.getElementById('admMarketName');
            let oTime = document.getElementById('admOpenTime');
            let oAmPm = document.getElementById('admOpenAmPm');
            let cTime = document.getElementById('admCloseTime');
            let cAmPm = document.getElementById('admCloseAmPm');
            if (mName) mName.value = m.name;
            if (oTime) oTime.value = m.openTime;
            if (oAmPm) oAmPm.value = m.openAmPm;
            if (cTime) cTime.value = m.closeTime;
            if (cAmPm) cAmPm.value = m.closeAmPm;
        }

        function adminEditMarket() {
            let sel = document.getElementById('admDelMarketId');
            let mName = document.getElementById('admMarketName');
            let oTime = document.getElementById('admOpenTime');
            let oAmPm = document.getElementById('admOpenAmPm');
            let cTime = document.getElementById('admCloseTime');
            let cAmPm = document.getElementById('admCloseAmPm');
            if (!sel || !mName || !oTime || !oAmPm || !cTime || !cAmPm) return;

            let mId = parseInt(sel.value, 10);
            let market = state.markets.find(m => m.id === mId);
            if (!market) return;

            let name = mName.value.trim().toUpperCase();
            let openTime = oTime.value.trim();
            let closeTime = cTime.value.trim();

            if (!name || !isValidTimeFormat(openTime) || !isValidTimeFormat(closeTime)) {
                alert("❌ कृपया मार्केट को सेलेक्ट करके ऊपर के बॉक्स में सही नाम और समय (जैसे 04:15) भरें!");
                return;
            }

            market.name = name;
            market.openTime = openTime;
            market.openAmPm = oAmPm.value;
            market.closeTime = closeTime;
            market.closeAmPm = cAmPm.value;

            saveState();
            alert("मार्केट अपडेट हो गई!");
            navigate('adminLogin');
        }

        function adminDelMarket() {
            let delElem = document.getElementById('admDelMarketId');
            if (!delElem) return;
            let mId = parseInt(delElem.value, 10);
            let market = state.markets.find(m => m.id === mId);
            if (!market) return;

            if (!confirm(`क्या आप वाकई "${market.name}" मार्केट डिलीट करना चाहते हैं? इसकी सभी PENDING बिड्स का पैसा यूज़र्स को वापस कर दिया जाएगा।`)) return;

            let refundedCount = 0;
            state.bids.forEach(b => {
                if (b.marketId === mId && b.status === "PENDING") {
                    b.status = "REFUNDED";
                    if (state.users[b.phone]) {
                        state.users[b.phone].balance = Math.round((state.users[b.phone].balance + b.amount) * 100) / 100;
                        state.transactions.push({
                            phone: b.phone,
                            type: `Market Deleted Refund (${b.marketName})`,
                            amount: b.amount,
                            time: new Date().toLocaleString()
                        });
                    }
                    refundedCount++;
                }
            });

            state.markets = state.markets.filter(m => m.id !== mId);
            saveState();
            alert(`मार्केट डिलीट हो गई! (${refundedCount} पेंडिंग बिड्स रिफंड की गईं)`);
            navigate('adminLogin');
        }

        function adminSaveRates() {
            let r1 = document.getElementById('rateSingle');
            let r2 = document.getElementById('rateJodi');
            let r3 = document.getElementById('rateSP');
            let r4 = document.getElementById('rateDP');
            if (!r1 || !r2 || !r3 || !r4) return;

            const ratePattern = /^\d+(?:\.\d+)?\s*ka\s*\d+(?:\.\d+)?$/i;
            let vals = [r1.value.trim(), r2.value.trim(), r3.value.trim(), r4.value.trim()];
            if (vals.some(v => !ratePattern.test(v))) {
                alert("❌ कृपया सभी रेट्स '10 ka 95' के फॉर्मेट में लिखें!");
                return;
            }

            state.gameRates = [
                { name: "Single Digit", rate: vals[0] },
                { name: "Jodi Digit", rate: vals[1] },
                { name: "Single Panna", rate: vals[2] },
                { name: "Double Panna", rate: vals[3] }
            ];
            saveState();
            alert("गेम रेट्स सफलतापूर्वक अपडेट हो गए!");
        }

        function getRateMultiplier(gameType) {
            const rateObj = state.gameRates.find(r => r.name === gameType);
            if (rateObj && rateObj.rate) {
                const match = rateObj.rate.match(/(\d+(?:\.\d+)?)\s*ka\s*(\d+(?:\.\d+)?)/i);
                if (match) {
                    const base = parseFloat(match[1]);
                    const payout = parseFloat(match[2]);
                    if (base > 0) return payout / base;
                }
            }
            if (gameType === "Single Digit") return 9.5;
            if (gameType === "Jodi Digit") return 95;
            if (gameType === "Single Panna") return 140;
            if (gameType === "Double Panna") return 280;
            return 0;
        }

        function pannaSumDigit(pannaStr) {
            return String((parseInt(pannaStr[0], 10) + parseInt(pannaStr[1], 10) + parseInt(pannaStr[2], 10)) % 10);
        }

        function adminDeclare() {
            let mElem = document.getElementById('admResMarket');
            let dElem = document.getElementById('admResDate');
            let rElem = document.getElementById('admResStr');
            if (!mElem || !dElem || !rElem) return;

            let mId = parseInt(mElem.value, 10);
            let targetDate = dElem.value || getLocalDateString();
            let resStr = rElem.value.trim();
            let market = state.markets.find(m => m.id === mId);
            if (!market) return;

            let parts = resStr.split('-');
            if (parts.length !== 3 || parts[0].length !== 3 || parts[1].length !== 2 || parts[2].length !== 3) {
                alert("❌ रिज़ल्ट का सही फॉर्मेट डालें! जैसे: 123-6*-*** या 123-68-459");
                return;
            }

            let openPanna = parts[0];
            let jodi = parts[1];
            let closePanna = parts[2];

            let hasOpen = /^\d{3}$/.test(openPanna) && /^\d$/.test(jodi[0]);
            let hasClose = /^\d{3}$/.test(closePanna) && /^\d$/.test(jodi[1]);
            let hasFullJodi = /^\d{2}$/.test(jodi);

            if (!hasOpen && !hasClose) {
                alert("❌ कम से कम OPEN या CLOSE के सही अंक दर्ज करें!");
                return;
            }

            if (hasOpen && pannaSumDigit(openPanna) !== jodi[0]) {
                alert(`❌ Open Panna (${openPanna}) का जोड़ ${pannaSumDigit(openPanna)} होता है, इसलिए Jodi का पहला अंक ${pannaSumDigit(openPanna)} होना चाहिए!`);
                return;
            }

            if (hasClose && pannaSumDigit(closePanna) !== jodi[1]) {
                alert(`❌ Close Panna (${closePanna}) का जोड़ ${pannaSumDigit(closePanna)} होता है, इसलिए Jodi का दूसरा अंक ${pannaSumDigit(closePanna)} होना चाहिए!`);
                return;
            }

            market.result = resStr;
            if (hasFullJodi) {
                if (!(market.lastChartDate === targetDate && market.chart[market.chart.length - 1] === resStr)) {
                    market.chart.push(resStr);
                    market.lastChartDate = targetDate;
                }
            }

            let openDigit = jodi[0];
            let closeDigit = jodi[1];
            let settledCount = 0;
            let wonCount = 0;
            let totalPayout = 0;

            state.bids.forEach(b => {
                if (b.marketId !== mId || b.status !== "PENDING" || b.date !== targetDate) return;

                let canSettle = false;
                let win = false;

                if (b.gameType === "Single Digit") {
                    if (b.session === "OPEN" && hasOpen) {
                        canSettle = true;
                        win = (b.digit === openDigit);
                    } else if (b.session === "CLOSE" && hasClose) {
                        canSettle = true;
                        win = (b.digit === closeDigit);
                    }
                } else if (b.gameType === "Jodi Digit") {
                    if (hasFullJodi) {
                        canSettle = true;
                        win = (b.digit === jodi);
                    }
                } else if (b.gameType === "Single Panna" || b.gameType === "Double Panna") {
                    if (b.session === "OPEN" && hasOpen) {
                        canSettle = true;
                        win = (b.digit === openPanna);
                    } else if (b.session === "CLOSE" && hasClose) {
                        canSettle = true;
                        win = (b.digit === closePanna);
                    }
                }

                if (canSettle) {
                    settledCount++;
                    if (win) {
                        wonCount++;
                        let mult = getRateMultiplier(b.gameType);
                        b.status = "WON";
                        b.winAmount = Math.round(b.amount * mult);
                        totalPayout += b.winAmount;
                        if (state.users[b.phone]) {
                            state.users[b.phone].balance = Math.round((state.users[b.phone].balance + b.winAmount) * 100) / 100;
                            state.transactions.push({
                                phone: b.phone,
                                type: `Won (${b.marketName} - ${b.gameType})`,
                                amount: b.winAmount,
                                time: new Date().toLocaleString()
                            });
                        }
                    } else {
                        b.status = "LOST";
                    }
                }
            });

            rElem.value = '';
            saveState();
            alert(`रिजल्ट घोषित और सेटल हो गया!\nतारीख: ${targetDate}\nकुल बिड्स सेटल: ${settledCount}\nजीत: ${wonCount} (कुल भुगतान: ₹${totalPayout})`);
            navigate('adminLogin');
        }

        function adminChangeCreds() {
            let pElem = document.getElementById('newAdminPhone');
            let pwElem = document.getElementById('newAdminPass');
            if (!pElem || !pwElem) return;
            let p = pElem.value.trim();
            let pw = pwElem.value.trim();
            if (!p || pw.length < 4) { alert("❌ कम से कम 4 अक्षर का नया पासवर्ड डालें!"); return; }
            state.adminCreds = { phone: p, pass: hashPassword(pw) };
            pwElem.value = '';
            saveState();
            alert("एडमिन पासवर्ड सफलतापूर्वक बदल गया!");
        }

        function adminSaveSettings() {
            let waElem = document.getElementById('admWa');
            let notElem = document.getElementById('admNotice');
            if (!waElem || !notElem) return;
            state.adminWhatsApp = waElem.value.trim();
            state.noticeText = notElem.value.trim();
            saveState();
            alert("सेटिंग्स सेव हो गई!");
        }

        if (!state.currentUserPhone || !state.users[state.currentUserPhone]) {
            renderLoginScreen();
        } else {
            let mh = document.getElementById('mainHeader');
            let nb = document.getElementById('noticeBoardDisplay');
            let bn = document.getElementById('bottomNav');
            if (mh) mh.style.display = 'flex';
            if (nb) nb.style.display = 'block';
            if (bn) bn.style.display = 'flex';
            navigate('home');
        }
    </script>
